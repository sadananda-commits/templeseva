<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Temple Seva Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   Palette grounded in temple materials: marigold garlands (primary),
   sindoor/kumkum red (accent), sandalwood paste (background). Display
   face Baloo 2 + body face Mukta -- both common in Indian consumer
   apps, warm and legible. Only 5 font weights loaded (trimmed from 8)
   for a faster first paint. Signature element: the "garland divider"
   -- a strung-marigold motif used once, under the header.
   ============================================================ */
:root{
  --bg: #FBF5E8;
  --surface: #FFFFFF;
  --surface-warm: #FFF8EC;
  --ink: #2B2118;
  --ink-soft: #6E5D48;
  --line: #E9DBC0;
  --primary: #C6591A;
  --primary-dark: #9C4212;
  --primary-soft: #F3D9AE;
  --accent: #7A1F3D;
  --accent-soft: #F1D9E1;
  --success: #3F7D53;
  --success-soft: #DCEFE1;
  --danger: #B23A34;
  --danger-soft: #F8DEDB;
  --radius: 16px;
  --font-display: 'Baloo 2', system-ui, sans-serif;
  --font-body: 'Mukta', system-ui, sans-serif;
  --shadow: 0 2px 10px rgba(43,33,24,0.08), 0 1px 2px rgba(43,33,24,0.06);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:700; color:var(--ink); margin:0;}
button{font-family:inherit;}
a{color:var(--primary-dark);}
img{max-width:100%;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

/* ---- Garland divider (signature element, used once) ---- */
.garland{
  height:14px; width:100%;
  background:
    radial-gradient(circle at 8px 6px, var(--primary) 4.5px, transparent 5px) 0 0/24px 14px repeat-x,
    radial-gradient(circle at 20px 9px, var(--accent) 3.5px, transparent 4px) 0 0/24px 14px repeat-x;
}

/* ---- Layout shell ---- */
.app{max-width:640px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative;}
header.top{
  background:linear-gradient(180deg, var(--accent) 0%, #611730 100%);
  color:#fff; padding:20px 20px 24px;
}
header.top .eyebrow{font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; font-weight:600;}
header.top h1{font-size:28px; color:#fff; margin-top:2px;}
header.top p.tag{margin:6px 0 0; opacity:.9; font-size:14.5px;}
nav.tabs{
  display:flex; gap:6px; padding:10px 12px; background:var(--surface);
  position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
nav.tabs button{
  border:none; background:transparent; padding:9px 14px; border-radius:999px;
  font-family:var(--font-display); font-weight:600; font-size:14px; color:var(--ink-soft);
  white-space:nowrap; cursor:pointer;
}
nav.tabs button.active{background:var(--primary); color:#fff;}
main{padding:16px 16px 90px;}
section.block{margin-bottom:22px;}
section.block h2{font-size:19px; margin-bottom:10px;}
.muted{color:var(--ink-soft); font-size:14px;}

/* ---- Cards ---- */
.card{
  background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:15px; margin-bottom:12px; border:1px solid var(--line); position:relative;
}
.card .card-title{font-family:var(--font-display); font-size:17px; font-weight:700;}
.card .meta{display:flex; flex-wrap:wrap; gap:9px; margin:7px 0; font-size:13.5px; color:var(--ink-soft);}
.card .meta span{display:inline-flex; align-items:center; gap:4px;}
.card .desc{font-size:13.5px; color:var(--ink-soft); margin:7px 0;}
.slotbar{height:7px; border-radius:99px; background:var(--line); overflow:hidden; margin:9px 0 4px;}
.slotbar .fill{height:100%; background:var(--primary); border-radius:99px;}
.slot-text{font-size:12.5px; font-weight:600;}
.slot-text.full{color:var(--danger);}
.slot-text.ok{color:var(--success);}
.badge{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px;}
.badge.full{background:var(--danger-soft); color:var(--danger);}
.badge.open{background:var(--success-soft); color:var(--success);}
.badge.event{background:var(--accent-soft); color:var(--accent);}
.badge.recur{background:var(--primary-soft); color:var(--primary-dark);}

/* ---- Buttons & forms ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:12px; padding:12px 16px; font-family:var(--font-display);
  font-weight:700; font-size:14.5px; cursor:pointer; width:100%;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-outline{background:transparent; border:1.5px solid var(--primary); color:var(--primary-dark);}
.btn-ghost{background:var(--surface-warm); color:var(--ink); border:1px solid var(--line);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.btn.small{width:auto; padding:8px 13px; font-size:13px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1.5px solid var(--line);
  font-family:var(--font-body); font-size:16px; background:#fff; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
.helper{font-size:12px; color:var(--ink-soft); margin-top:5px;}
.error-text{font-size:13px; color:var(--danger); margin-top:8px; font-weight:600;}
.success-text{font-size:13px; color:var(--success); margin-top:8px; font-weight:600;}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* ---- Modal / sheet ---- */
.overlay{position:fixed; inset:0; background:rgba(43,33,24,0.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;}
.sheet{background:var(--bg); width:100%; max-width:640px; border-radius:18px 18px 0 0; max-height:88vh; overflow-y:auto; padding:18px 16px 26px; animation:up .13s ease-out;}
@keyframes up{from{transform:translateY(16px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.sheet-head h3{font-size:18px;}
.close-x{background:var(--surface-warm); border:none; border-radius:99px; width:30px; height:30px; font-size:15px; cursor:pointer; color:var(--ink-soft);}

/* ---- Search dropdown ---- */
.result-list{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:6px; background:#fff;}
.result-item{padding:11px 13px; border-bottom:1px solid var(--line); cursor:pointer; font-size:14px;}
.result-item:last-child{border-bottom:none;}
.result-item:active{background:var(--surface-warm);}
.result-item .r-name{font-weight:600;}
.result-item .r-mobile{color:var(--ink-soft); font-size:12.5px;}

/* ---- Empty state ---- */
.empty{text-align:center; padding:36px 16px; color:var(--ink-soft);}
.empty .glyph{font-size:32px; margin-bottom:8px;}

/* ---- Admin ---- */
.pin-box{max-width:320px; margin:56px auto; text-align:center;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px; text-align:center;}
.stat .num{font-family:var(--font-display); font-size:24px; font-weight:700; color:var(--primary-dark);}
.stat .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}
table.simple{width:100%; border-collapse:collapse; font-size:13px;}
table.simple th, table.simple td{text-align:left; padding:7px 5px; border-bottom:1px solid var(--line);}
table.simple th{color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
.reg-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); gap:8px;}
.reg-row:last-child{border-bottom:none;}
.reg-row .who{font-size:14px;}
.reg-row .who .m{color:var(--ink-soft); font-size:12px;}
.pill-toggle{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
.pill-toggle .btn{width:auto; white-space:nowrap;}
.tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}

.toast{
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:80;
  background:var(--ink); color:#fff; padding:11px 17px; border-radius:12px; font-size:13.5px;
  max-width:90%; text-align:center; box-shadow:var(--shadow);
}
.spinner{width:20px; height:20px; border:3px solid var(--primary-soft); border-top-color:var(--primary); border-radius:50%; animation:spin .6s linear infinite; margin:18px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.skeleton{background:linear-gradient(90deg, var(--surface-warm) 25%, var(--line) 37%, var(--surface-warm) 63%); background-size:400% 100%; animation:sk 1.2s ease infinite; border-radius:var(--radius); height:96px; margin-bottom:12px;}
@keyframes sk{0%{background-position:100% 0;} 100%{background-position:0 0;}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="eyebrow" id="hdr-eyebrow">Temple Seva</div>
    <h1 id="hdr-title">Temple Seva</h1>
    <p class="tag" id="hdr-tag">Serve with devotion. Participate in seva.</p>
  </header>
  <div class="garland"></div>
  <nav class="tabs" id="nav-tabs">
    <button data-tab="home">Upcoming Seva</button>
    <button data-tab="events">Events</button>
    <button data-tab="myseva">My Seva</button>
    <button data-tab="admin">Admin</button>
  </nav>
  <main id="main"></main>
</div>

<script>
/* ============================================================
   CONFIG -- paste your Apps Script Web App URL here after deploying
   ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxONGMsHwUypS-ucqRD_6i2FgyueKlvvuyYVW2fk70fkfgRRW4BQ-iS8KbE11yH1aU_/exec',
  TEMPLE_NAME: 'Temple Seva',
  TAGLINE: 'Serve with devotion. Participate in seva.'
};
document.getElementById('hdr-eyebrow').textContent = CONFIG.TEMPLE_NAME;
document.getElementById('hdr-tag').textContent = CONFIG.TAGLINE;

/* ---------------- API layer ---------------- */
const api = {
  async get(action, params) {
    const qs = new URLSearchParams(Object.assign({ action }, params || {})).toString();
    const res = await fetch(`${CONFIG.API_URL}?${qs}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Something went wrong.');
    return json.data;
  },
  async post(action, payload) {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight to Apps Script
      body: JSON.stringify(Object.assign({ action }, payload || {}))
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'Something went wrong.');
    return json.data;
  }
};

/* ---------------- Lightweight response cache ----------------
   Tab switches and re-visits read from cache instantly (no spinner,
   no round trip) instead of re-fetching every time. Any write
   operation busts the whole cache since seva/events/registrations
   are all cross-referenced. */
const cache = new Map();
async function cachedGet(key, fetcher, ttlMs = 20000) {
  const hit = cache.get(key);
  if (hit && Date.now() - hit.ts < ttlMs) return hit.data;
  const data = await fetcher();
  cache.set(key, { ts: Date.now(), data });
  return data;
}
function bustCache() { cache.clear(); }

/* ---------------- Storage ---------------- */
const store = {
  get me() { try { return JSON.parse(localStorage.getItem('seva_me') || 'null'); } catch (e) { return null; } },
  set me(v) { localStorage.setItem('seva_me', JSON.stringify(v)); },
  clearMe() { localStorage.removeItem('seva_me'); },
  get admin() { try { return JSON.parse(sessionStorage.getItem('seva_admin') || 'null'); } catch (e) { return null; } },
  set admin(v) { sessionStorage.setItem('seva_admin', JSON.stringify(v)); },
  clearAdmin() { sessionStorage.removeItem('seva_admin'); }
};

let state = { tab: 'home', route: {}, sevaList: [] };

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}
// Google Sheets stores time-only cells as a Date on 1899-12-30, which the API
// serializes as e.g. "1899-12-30T15:30:00.000Z". This turns that (or a plain
// "HH:MM") into a friendly "3:30 PM" for display.
function fmtTime(t) {
  if (!t) return '';
  const s = String(t);
  let hours, minutes;
  const isoMatch = s.match(/T(\d{2}):(\d{2})/);
  const plainMatch = s.match(/^(\d{1,2}):(\d{2})/);
  if (isoMatch) {
    // Time-only cells come back in UTC; read the UTC hour/minute directly
    // rather than converting to the browser's local timezone.
    hours = Number(isoMatch[1]); minutes = isoMatch[2];
  } else if (plainMatch) {
    hours = Number(plainMatch[1]); minutes = plainMatch[2];
  } else {
    return s;
  }
  const period = hours >= 12 ? 'PM' : 'AM';
  const h12 = hours % 12 === 0 ? 12 : hours % 12;
  return `${h12}:${minutes} ${period}`;
}
// Formats a time value into "HH:MM" (24-hour) for pre-filling <input type="time">.
function fmtTimeInput(t) {
  if (!t) return '';
  const s = String(t);
  const isoMatch = s.match(/T(\d{2}):(\d{2})/);
  if (isoMatch) return `${isoMatch[1]}:${isoMatch[2]}`;
  const plainMatch = s.match(/^(\d{1,2}):(\d{2})/);
  if (plainMatch) return `${plainMatch[1].padStart(2, '0')}:${plainMatch[2]}`;
  return '';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const skeletons = (n) => Array(n).fill('<div class="skeleton"></div>').join('');

/* ---------------- Router: persistent shell, main-only re-render ----------------
   The header/nav are built once in the static HTML above and never touched
   again -- only #main is re-rendered on tab changes. This is what makes tab
   switching feel instant instead of re-painting the whole page each time. */
function setTab(tab, route) {
  state.tab = tab; state.route = route || {};
  document.querySelectorAll('#nav-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderMain();
}

async function renderMain() {
  const main = document.getElementById('main');
  try {
    if (state.tab === 'home') await renderHome(main);
    else if (state.tab === 'events') await renderEvents(main);
    else if (state.tab === 'event') await renderEventDetail(main, state.route.eventId);
    else if (state.tab === 'myseva') await renderMySeva(main);
    else if (state.tab === 'admin') await renderAdmin(main);
  } catch (e) {
    main.innerHTML = `<div class="empty"><div class="glyph">⚠️</div><p>${escapeHtml(e.message)}</p></div>`;
  }
}

document.getElementById('nav-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) setTab(btn.dataset.tab);
});

/* ---------------- Seva card ---------------- */
function sevaCard(s) {
  const max = Number(s['Max Volunteers']) || 0;
  const count = s.RegisteredCount || 0;
  const pct = max > 0 ? Math.min(100, Math.round((count / max) * 100)) : 0;
  const full = s.IsFull;
  return `
    <div class="card" data-seva-id="${escapeHtml(s['Seva ID'])}">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
        <div class="card-title">${escapeHtml(s['Seva Name'])}</div>
        <span class="badge ${full ? 'full' : 'open'}">${full ? 'FULL' : 'OPEN'}</span>
      </div>
      <div class="meta">
        <span>📅 ${fmtDate(s['Date'])}</span>
        <span>⏰ ${fmtTime(s['Start Time'])}${s['End Time'] ? '–' + fmtTime(s['End Time']) : ''}</span>
        ${s['Location'] ? `<span>📍 ${escapeHtml(s['Location'])}</span>` : ''}
        ${s['Recurring Pattern ID'] ? `<span class="badge recur">RECURRING</span>` : ''}
      </div>
      ${s['Instructions'] ? `<div class="desc">${escapeHtml(s['Instructions'])}</div>` : ''}
      ${max > 0 ? `
        <div class="slotbar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="slot-text ${full ? 'full' : 'ok'}">${count} / ${max} volunteers${full ? '' : ' &middot; ' + (max - count) + ' slots remaining'}</div>
      ` : `<div class="slot-text ok">${count} registered</div>`}
      <div style="margin-top:11px;">
        <button class="btn ${full ? 'btn-ghost' : 'btn-primary'}" ${full ? 'disabled' : ''} data-register="${escapeHtml(s['Seva ID'])}">
          ${full ? 'Full — Join Waitlist' : 'Register for Seva'}
        </button>
      </div>
    </div>
  `;
}

/* ---------------- Home ---------------- */
async function renderHome(main) {
  if (!cache.has('upcomingSeva')) main.innerHTML = skeletons(3);
  const seva = await cachedGet('upcomingSeva', () => api.get('upcomingSeva'));
  state.sevaList = seva;
  if (!seva.length) {
    main.innerHTML = `<div class="empty"><div class="glyph">🪔</div><p>No seva opportunities open right now. Please check back soon.</p></div>`;
    return;
  }
  main.innerHTML = `<section class="block"><h2>Upcoming Seva</h2>${seva.map(sevaCard).join('')}</section>`;
  bindRegisterButtons();
}

/* ---------------- Events ---------------- */
async function renderEvents(main) {
  if (!cache.has('eventList')) main.innerHTML = skeletons(2);
  const events = await cachedGet('eventList', () => api.get('eventList'));
  if (!events.length) {
    main.innerHTML = `<div class="empty"><div class="glyph">🎉</div><p>No upcoming events scheduled.</p></div>`;
    return;
  }
  main.innerHTML = `
    <section class="block">
      <h2>Upcoming Events</h2>
      ${events.map(ev => `
        <div class="card" data-event="${escapeHtml(ev['Event ID'])}" style="cursor:pointer;">
          <span class="badge event">EVENT</span>
          <div class="card-title" style="margin-top:6px;">${escapeHtml(ev['Event Name'])}</div>
          <div class="meta">
            <span>📅 ${fmtDate(ev['Start Date'])}${ev['End Date'] && ev['End Date'] !== ev['Start Date'] ? ' – ' + fmtDate(ev['End Date']) : ''}</span>
            ${ev['Location'] ? `<span>📍 ${escapeHtml(ev['Location'])}</span>` : ''}
          </div>
          ${ev['Description'] ? `<div class="desc">${escapeHtml(ev['Description'])}</div>` : ''}
          <div style="margin-top:10px;"><button class="btn btn-outline">View Seva Opportunities</button></div>
        </div>
      `).join('')}
    </section>
  `;
  main.querySelectorAll('[data-event]').forEach(card => {
    card.addEventListener('click', () => setTab('event', { eventId: card.dataset.event }));
  });
}

async function renderEventDetail(main, eventId) {
  main.innerHTML = skeletons(2);
  const detail = await cachedGet('eventDetail:' + eventId, () => api.get('eventDetail', { eventId }));
  const ev = detail.event;
  main.innerHTML = `
    <button class="btn btn-ghost small" id="back-events" style="margin-bottom:12px;">← All events</button>
    <section class="block">
      <h2>${escapeHtml(ev['Event Name'])}</h2>
      <p class="muted">${fmtDate(ev['Start Date'])}${ev['Location'] ? ' · ' + escapeHtml(ev['Location']) : ''}</p>
      ${ev['Description'] ? `<p class="desc">${escapeHtml(ev['Description'])}</p>` : ''}
    </section>
    <section class="block">
      <h2>Available Seva</h2>
      ${detail.sevaOpportunities.length ? detail.sevaOpportunities.map(sevaCard).join('') : '<div class="empty">No seva opportunities posted for this event yet.</div>'}
    </section>
  `;
  document.getElementById('back-events').addEventListener('click', () => setTab('events'));
  bindRegisterButtons();
}

/* ---------------- Register flow (modal) ---------------- */
function bindRegisterButtons() {
  document.querySelectorAll('[data-register]').forEach(btn => {
    btn.addEventListener('click', () => openRegisterModal(btn.dataset.register));
  });
}

function openModal(innerHtml) {
  const wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.innerHTML = `<div class="sheet">${innerHtml}</div>`;
  wrap.addEventListener('click', e => { if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
  return wrap;
}

function openRegisterModal(sevaId) {
  const seva = state.sevaList.find(s => String(s['Seva ID']) === String(sevaId)) || {};
  const me = store.me;
  const overlay = openModal(`
    <div class="sheet-head">
      <h3>Register — ${escapeHtml(seva['Seva Name'] || 'Seva')}</h3>
      <button class="close-x" id="modal-close">✕</button>
    </div>
    <div id="modal-body"></div>
  `);
  overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
  const body = overlay.querySelector('#modal-body');

  if (me && me.participantId) {
    body.innerHTML = `
      <p>Registering as <strong>${escapeHtml(me.fullName)}</strong>.</p>
      <button class="btn btn-primary" id="confirm-existing">Confirm Registration</button>
      <button class="btn btn-ghost" id="not-me" style="margin-top:8px;">Not me — use a different profile</button>
      <div id="modal-msg"></div>
    `;
    body.querySelector('#confirm-existing').addEventListener('click', async () => {
      try {
        await api.post('register', { participantId: me.participantId, mobile: me.mobile, sevaId });
        bustCache();
        body.querySelector('#modal-msg').innerHTML = `<div class="success-text">You're registered! See you there. 🙏</div>`;
        setTimeout(() => { overlay.remove(); renderMain(); }, 900);
      } catch (e) {
        body.querySelector('#modal-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`;
      }
    });
    body.querySelector('#not-me').addEventListener('click', () => { store.clearMe(); renderIdentifyStep(body, sevaId, overlay); });
  } else {
    renderIdentifyStep(body, sevaId, overlay);
  }
}

function renderIdentifyStep(body, sevaId, overlay) {
  body.innerHTML = `
    <div class="field">
      <label>Search your name (if you've registered before)</label>
      <input type="text" id="search-name" placeholder="Start typing your name…">
      <div id="search-results"></div>
    </div>
    <p class="muted" style="text-align:center; margin:12px 0;">— or —</p>
    <button class="btn btn-outline" id="first-time-btn">I'm registering for the first time</button>
  `;
  let searchTimer;
  body.querySelector('#search-name').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    const resultsEl = body.querySelector('#search-results');
    if (q.length < 2) { resultsEl.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const results = await api.get('searchParticipants', { q });
      resultsEl.innerHTML = results.length ? `<div class="result-list">${results.map(r => `
        <div class="result-item" data-pid="${escapeHtml(r['Participant ID'])}" data-name="${escapeHtml(r['Full Name'])}">
          <div class="r-name">${escapeHtml(r['Full Name'])}</div>
          <div class="r-mobile">Mobile ending ${escapeHtml(r['Mobile Masked'])}</div>
        </div>`).join('')}</div>` : `<p class="muted" style="margin-top:6px;">No match. Try first-time registration below.</p>`;
      resultsEl.querySelectorAll('.result-item').forEach(item => {
        item.addEventListener('click', () => renderVerifyStep(body, sevaId, item.dataset.pid, item.dataset.name, overlay));
      });
    }, 180);
  });
  body.querySelector('#first-time-btn').addEventListener('click', () => renderNewParticipantStep(body, sevaId, overlay));
}

function renderVerifyStep(body, sevaId, participantId, fullName, overlay) {
  body.innerHTML = `
    <p>Hi <strong>${escapeHtml(fullName)}</strong> — enter your mobile number to confirm it's you.</p>
    <div class="field"><label>Mobile Number</label><input type="tel" id="verify-mobile" placeholder="Last 4 digits or full number"></div>
    <button class="btn btn-primary" id="verify-btn">Confirm &amp; Register</button>
    <div id="modal-msg"></div>
  `;
  body.querySelector('#verify-btn').addEventListener('click', async () => {
    const mobile = body.querySelector('#verify-mobile').value.trim();
    try {
      await api.post('register', { participantId, mobile, sevaId });
      bustCache();
      store.me = { participantId, fullName, mobile };
      body.querySelector('#modal-msg').innerHTML = `<div class="success-text">You're registered! See you there. 🙏</div>`;
      setTimeout(() => { overlay.remove(); renderMain(); }, 900);
    } catch (e) {
      body.querySelector('#modal-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`;
    }
  });
}

function renderNewParticipantStep(body, sevaId, overlay) {
  body.innerHTML = `
    <div class="field"><label>Full Name</label><input type="text" id="new-name" placeholder="Your full name"></div>
    <div class="field"><label>Mobile Number</label><input type="tel" id="new-mobile" placeholder="10-digit mobile number"></div>
    <div class="field"><label>Email (optional)</label><input type="email" id="new-email" placeholder="you@example.com"></div>
    <button class="btn btn-primary" id="new-submit">Register</button>
    <div id="modal-msg"></div>
  `;
  body.querySelector('#new-submit').addEventListener('click', async () => {
    const fullName = body.querySelector('#new-name').value.trim();
    const mobile = body.querySelector('#new-mobile').value.trim();
    const email = body.querySelector('#new-email').value.trim();
    if (!fullName || !mobile) {
      body.querySelector('#modal-msg').innerHTML = `<div class="error-text">Name and mobile number are required.</div>`;
      return;
    }
    try {
      const result = await api.post('registerParticipant', { fullName, mobile, email, sevaId });
      bustCache();
      store.me = { participantId: result.participantId, fullName, mobile };
      body.querySelector('#modal-msg').innerHTML = `<div class="success-text">Welcome, ${escapeHtml(fullName)}! You're registered. 🙏</div>`;
      setTimeout(() => { overlay.remove(); renderMain(); }, 1000);
    } catch (e) {
      body.querySelector('#modal-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`;
    }
  });
}

async function loadMySevaDashboard(main, participantId, mobile) {
  main.innerHTML = skeletons(2);
  const data = await api.get('participantDashboard', { participantId, mobile });
  const rows = (list) => list.length ? list.map(c => `
    <div class="card">
      <div class="card-title">${escapeHtml(c.sevaName)}</div>
      <div class="meta">
        <span>📅 ${fmtDate(c.date)}</span>
        ${c.startTime ? `<span>⏰ ${fmtTime(c.startTime)}${c.endTime ? '–' + fmtTime(c.endTime) : ''}</span>` : ''}
        ${c.location ? `<span>📍 ${escapeHtml(c.location)}</span>` : ''}
        ${c.eventName ? `<span class="badge event">${escapeHtml(c.eventName)}</span>` : ''}
      </div>
      <div class="muted">Status: ${escapeHtml(c.status)}${c.attendance && c.attendance !== 'PENDING' ? ' · ' + escapeHtml(c.attendance) : ''}</div>
      ${c.status === 'CONFIRMED' ? `<button class="btn btn-danger small" style="margin-top:10px;" data-cancel="${escapeHtml(c.registrationId)}">Cancel</button>` : ''}
    </div>
  `).join('') : '<div class="empty" style="padding:20px;">Nothing here yet.</div>';

  main.innerHTML = `
    <section class="block">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>Hi, ${escapeHtml(data.participant['Full Name'])}</h2>
        <button class="btn btn-ghost small" id="switch-profile">Switch profile</button>
      </div>
      <p class="muted">${escapeHtml(data.participant['Mobile Number'])}</p>
    </section>
    <section class="block">
      <h2>Upcoming Seva</h2>
      ${rows(data.upcoming)}
    </section>
    ${data.past.length ? `<section class="block"><h2>Past Seva</h2>${rows(data.past)}</section>` : ''}

  document.getElementById('switch-profile').addEventListener('click', () => { store.clearMe(); setTab('myseva'); });

      try {
        await api.post('cancelRegistration', { registrationId: btn.dataset.cancel, participantId, mobile });
        bustCache();
        toast('Registration cancelled.');
        loadMySevaDashboard(main, participantId, mobile);
      } catch (e) { toast(e.message); }

  });
}

const DOW_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// Drives both the Super Admin dashboard and the scoped Admin dashboard from one
// place. Scoped admins get a smaller tab set ("My Seva" instead of "Seva", no
// Overview/Reports) and are locked to their own Seva Type when creating seva or
// recurring patterns — but both roles can create Events, add Seva Opportunities
// (one-time or recurring) under them, and manage their own recurring patterns.
async function renderAdminDashboard(content, pin, isSuperAdmin, overview) {
  const tabs = isSuperAdmin
    ? [['overview', 'Overview'], ['seva', 'Seva'], ['events', 'Events'], ['recurring', 'Recurring'], ['reports', 'Reports']]
    : [['seva', 'My Seva'], ['events', 'Events'], ['recurring', 'Recurring']];

  content.innerHTML = `
    <div class="pill-toggle">
      ${tabs.map(t => `<button class="btn small ${t[0] === tabs[0][0] ? 'btn-primary' : 'btn-ghost'}" data-sa-view="${t[0]}">${t[1]}</button>`).join('')}
    </div>
    <div id="sa-body"></div>
  `;
  const body = content.querySelector('#sa-body');

  function paintTabs(active) {
    content.querySelectorAll('[data-sa-view]').forEach(b => {
      b.className = 'btn small ' + (b.dataset.saView === active ? 'btn-primary' : 'btn-ghost');
    });
  }

  // ---- Overview (super admin only) ----
  function showOverview() {
    paintTabs('overview');
    body.innerHTML = `
      <h3 style="margin-bottom:10px;">Today</h3>
      <div class="stat-grid">
        <div class="stat"><div class="num">${overview.today.totalSevaOpportunities}</div><div class="lbl">Seva Today</div></div>
        <div class="stat"><div class="num">${overview.today.totalVolunteers}</div><div class="lbl">Volunteers</div></div>
        <div class="stat"><div class="num">${overview.today.vacantSlots}</div><div class="lbl">Vacant Slots</div></div>
        <div class="stat"><div class="num">${overview.today.fullyBooked}</div><div class="lbl">Fully Booked</div></div>
      </div>
      <h3 style="margin:16px 0 10px;">Upcoming Events</h3>
      ${overview.upcomingEvents.map(ev => `
        <div class="card">
          <div class="card-title">${escapeHtml(ev.eventName)}</div>
          <div class="meta"><span>${ev.sevaOpportunities} seva</span><span>${ev.registrations} registrations</span><span>${ev.vacantSlots} vacant</span></div>
        </div>
      `).join('') || '<p class="muted">No upcoming events.</p>'}
    `;
  }

  // Returns the seva list this role is allowed to see/manage: everything for
  // Super Admin, only their assigned Seva Type's rows for a scoped Admin.
  async function fetchSevaList() {
    if (isSuperAdmin) return await cachedGet('allSeva:' + pin, () => api.get('allSeva', { pin }), 8000);
    return await cachedGet('adminSeva:' + pin, () => api.get('adminSeva', { pin }), 8000);
  }

  function wireSevaCardActions(scopeEl, sevaList, refresh) {
    scopeEl.querySelectorAll('[data-attend]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await api.post('markAttendance', { pin, registrationId: btn.dataset.attend, status: 'ATTENDED' });
          bustCache();
          toast('Marked attended.');
          refresh();
        } catch (e) { toast(e.message); }
      });
    });
    scopeEl.querySelectorAll('[data-add-participant]').forEach(btn => {
      btn.addEventListener('click', () => {
        const sevaId = btn.dataset.addParticipant;
        const overlay = openModal(`
          <div class="sheet-head"><h3>Add Participant</h3><button class="close-x" id="modal-close">✕</button></div>
          <div class="field"><label>Full Name</label><input id="ap-name"></div>
          <div class="field"><label>Mobile</label><input id="ap-mobile" type="tel"></div>
          <button class="btn btn-primary" id="ap-submit">Add</button>
          <div id="ap-msg"></div>
        `);
        overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#ap-submit').addEventListener('click', async () => {
          try {
            await api.post('adminAddParticipant', { pin, sevaId, fullName: overlay.querySelector('#ap-name').value.trim(), mobile: overlay.querySelector('#ap-mobile').value.trim() });
            bustCache();
            overlay.remove();
            toast('Participant added.');
            refresh();
          } catch (e) { overlay.querySelector('#ap-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
        });
      });
    });
    scopeEl.querySelectorAll('[data-edit-seva]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = sevaList.find(x => String(x['Seva ID']) === btn.dataset.editSeva);
        openSevaModal(s || {}, refresh);
      });
    });
    scopeEl.querySelectorAll('[data-cancel-seva]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Cancel this seva opportunity? Existing registrants stay on record, but no new signups will be allowed.')) return;
        try {
          await api.post('cancelSeva', { pin, sevaId: btn.dataset.cancelSeva });
          bustCache();
          toast('Seva cancelled.');
          refresh();
        } catch (e) { toast(e.message); }
      });
    });
  }

  // ---- Seva ("Seva" for Super Admin, "My Seva" for a scoped Admin) ----
  async function showSeva() {
    paintTabs('seva');
    body.innerHTML = skeletons(2);
    const seva = await fetchSevaList();

    if (isSuperAdmin) {
      body.innerHTML = `
        <button class="btn btn-primary" id="new-seva-btn" style="margin-bottom:14px;">+ New Seva Opportunity</button>
        <table class="simple">
          <tr><th>Seva</th><th>Date</th><th>Reg</th><th>Status</th><th></th></tr>
          ${seva.map(s => `<tr>
            <td>${escapeHtml(s['Seva Name'])}</td>
            <td>${fmtDate(s['Date'])}</td>
            <td>${s.RegisteredCount}/${s['Max Volunteers'] || '—'}</td>
            <td>${escapeHtml(s['Status'])}</td>
            <td><button class="btn btn-ghost small" data-edit-seva="${escapeHtml(s['Seva ID'])}">Edit</button></td>
          </tr>`).join('')}
        </table>
      `;
      document.getElementById('new-seva-btn').addEventListener('click', () => openSevaModal({}, showSeva));
      wireSevaCardActions(body, seva, showSeva);
      return;
    }

    // Scoped admin: card view with registrations + attendance, same as before,
    // plus the ability to create/edit/cancel seva of their own assigned type.
    body.innerHTML = `
      <button class="btn btn-primary" id="new-seva-btn" style="margin-bottom:14px;">+ New Seva Opportunity</button>
      ${seva.length ? seva.map(s => `
        <div class="card">
          <div class="card-title">${escapeHtml(s['Seva Name'])}</div>
          <div class="meta"><span>📅 ${fmtDate(s['Date'])}</span><span>${s.RegisteredCount} registered</span></div>
          <div style="margin:10px 0;">
            ${s.Registrations.map(r => `
              <div class="reg-row">
                <div class="who">${escapeHtml(r['Participant Name'])}<br><span class="m">${escapeHtml(r['Mobile Number'])} · ${escapeHtml(r['Attendance Status'] || 'PENDING')}</span></div>
                <button class="btn btn-outline small" data-attend="${escapeHtml(r['Registration ID'])}">Mark Attended</button>
              </div>
            `).join('') || '<p class="muted">No registrations yet.</p>'}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-ghost small" data-add-participant="${escapeHtml(s['Seva ID'])}">+ Add Participant</button>
            <button class="btn btn-outline small" data-edit-seva="${escapeHtml(s['Seva ID'])}">Edit</button>
            <button class="btn btn-danger small" data-cancel-seva="${escapeHtml(s['Seva ID'])}">Cancel</button>
          </div>
        </div>
      `).join('') : '<div class="empty">No seva opportunities of your type yet — create one above.</div>'}
    `;
    document.getElementById('new-seva-btn').addEventListener('click', () => openSevaModal({}, showSeva));
    wireSevaCardActions(body, seva, showSeva);
  }

  // Shared create/edit modal for a Seva Opportunity. When creating (not editing),
  // this also covers recurring seva -- Frequency picks between a single date,
  // every week, or one specific week each month (e.g. "2nd Sunday"), so a single
  // form handles both once-off and recurring seva under an event.
  // existing: {} for a brand-new standalone seva, {eventId} when adding a seva
  // under a specific event, or a full seva row (from allSeva/adminSeva) to edit.
  function openSevaModal(existing, onDone) {
    const isEdit = !!existing['Seva ID'];
    const eventId = existing.eventId || '';
    const overlay = openModal(`
      <div class="sheet-head"><h3>${isEdit ? 'Edit Seva Opportunity' : 'New Seva'}</h3><button class="close-x" id="modal-close">✕</button></div>
      ${isSuperAdmin ? `<div class="field"><label>Seva Type ID</label><input id="ns-type" value="${isEdit ? escapeHtml(existing['Seva Type ID']) : ''}" placeholder="e.g. ST_ABC123"></div>` : ''}
      ${!isEdit && !eventId ? `<div class="field"><label>Event ID (optional)</label><input id="ns-event" placeholder="Leave blank for a standalone / ad-hoc seva"></div>` : ''}
      ${eventId ? `<p class="helper">Adding this under the event you selected.</p>` : ''}
      <div class="field"><label>Seva Name</label><input id="ns-name" value="${isEdit ? escapeHtml(existing['Seva Name']) : ''}"></div>
      ${isEdit ? `
      <div class="field"><label>Date</label><input id="ns-date" type="date" value="${fmtInputDate(existing['Date'])}"></div>
      ` : `
      <div class="field"><label>Frequency</label>
        <select id="ns-freq">
          <option value="ONCE">Just one date</option>
          <option value="WEEKLY">Every week</option>
          <option value="MONTHLY_NTH" selected>One specific week each month</option>
        </select>
      </div>
      <div id="ns-once-wrap" style="display:none;">
        <div class="field"><label>Date</label><input id="ns-date" type="date"></div>
      </div>
      <div id="ns-recur-wrap" class="row-2">
        <div class="field"><label>Day of Week</label>
          <select id="ns-dow">${DOW_NAMES.map((d, i) => `<option value="${i}" ${i === 0 ? 'selected' : ''}>${d}</option>`).join('')}</select>
        </div>
        <div class="field" id="ns-week-wrap">
          <label>Which week</label>
          <select id="ns-week">
            <option value="1" selected>1st</option><option value="2">2nd</option><option value="3">3rd</option>
            <option value="4">4th</option><option value="LAST">Last</option>
          </select>
        </div>
      </div>
      `}
      <div class="row-2">
        <div class="field"><label>Start Time</label><input id="ns-start" type="time" value="${isEdit ? fmtTimeInput(existing['Start Time']) : ''}"></div>
        <div class="field"><label>End Time</label><input id="ns-end" type="time" value="${isEdit ? fmtTimeInput(existing['End Time']) : ''}"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Location</label><input id="ns-location" value="${isEdit ? escapeHtml(existing['Location']) : ''}"></div>
        <div class="field"><label>Max Volunteers</label><input id="ns-max" type="number" value="${isEdit ? escapeHtml(existing['Max Volunteers']) : ''}"></div>
      </div>
      <button class="btn btn-primary" id="ns-submit">${isEdit ? 'Save Changes' : 'Create'}</button>
      ${!isEdit ? '<p class="helper">"One specific week each month" (e.g. 2nd Sunday) is the usual choice for a monthly seva. Pick "Every week" for a weekly seva like every Sunday, or "Just one date" for a single occurrence.</p>' : ''}
      <div id="ns-msg"></div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());

    if (!isEdit) {
      const freqEl = overlay.querySelector('#ns-freq');
      const onceWrap = overlay.querySelector('#ns-once-wrap');
      const recurWrap = overlay.querySelector('#ns-recur-wrap');
      const weekWrap = overlay.querySelector('#ns-week-wrap');
      const syncFreq = () => {
        const v = freqEl.value;
        onceWrap.style.display = v === 'ONCE' ? 'block' : 'none';
        recurWrap.style.display = v === 'ONCE' ? 'none' : 'grid';
        weekWrap.style.display = v === 'MONTHLY_NTH' ? 'block' : 'none';
      };
      freqEl.addEventListener('change', syncFreq);
      syncFreq();
    }

    overlay.querySelector('#ns-submit').addEventListener('click', async () => {
      const freq = isEdit ? 'ONCE' : overlay.querySelector('#ns-freq').value;
      const common = {
        pin,
        name: overlay.querySelector('#ns-name').value.trim(),
        startTime: overlay.querySelector('#ns-start').value,
        endTime: overlay.querySelector('#ns-end').value,
        location: overlay.querySelector('#ns-location').value.trim(),
        maxVolunteers: overlay.querySelector('#ns-max').value
      };
      if (isSuperAdmin && overlay.querySelector('#ns-type')) common.sevaTypeId = overlay.querySelector('#ns-type').value.trim();
      try {
        if (isEdit) {
          await api.post('updateSeva', Object.assign(common, { sevaId: existing['Seva ID'], date: overlay.querySelector('#ns-date').value }));
          toast('Seva opportunity updated.');
        } else if (freq === 'ONCE') {
          const evId = eventId || (overlay.querySelector('#ns-event') ? overlay.querySelector('#ns-event').value.trim() : '');
          await api.post('createSeva', Object.assign(common, { date: overlay.querySelector('#ns-date').value, eventId: evId }));
          toast('Seva opportunity created.');
        } else {
          const evId = eventId || (overlay.querySelector('#ns-event') ? overlay.querySelector('#ns-event').value.trim() : '');
          const result = await api.post('createRecurringPattern', Object.assign(common, {
            recurrenceType: freq,
            dayOfWeek: overlay.querySelector('#ns-dow').value,
            weekOfMonth: overlay.querySelector('#ns-week').value,
            eventId: evId
          }));
          toast(`Recurring seva created — ${result.created} date${result.created === 1 ? '' : 's'} already scheduled.`);
        }
        bustCache();
        overlay.remove();
        if (onDone) onDone();
      } catch (e) { overlay.querySelector('#ns-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
    });
  }

  // ---- Events (shared: both roles can create events and add seva under them) ----
  async function showEvents() {
    paintTabs('events');
    body.innerHTML = skeletons(2);
    const [events, seva] = await Promise.all([
      cachedGet('allEvents:' + pin, () => api.get('allEvents', { pin }), 8000),
      fetchSevaList()
    ]);
    const sevaByEvent = {};
    seva.forEach(s => {
      const key = s['Event ID'];
      if (!key) return;
      (sevaByEvent[key] = sevaByEvent[key] || []).push(s);
    });

    body.innerHTML = `
      <button class="btn btn-primary" id="new-event-btn" style="margin-bottom:14px;">+ New Event</button>
      ${events.length ? events.map(ev => {
        const evSeva = sevaByEvent[ev['Event ID']] || [];
        return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div class="card-title">${escapeHtml(ev['Event Name'])}</div>
            <span class="badge ${String(ev['Status']).toUpperCase() === 'ACTIVE' ? 'open' : 'full'}">${escapeHtml(ev['Status'])}</span>
          </div>
          <div class="meta">
            <span>📅 ${fmtDate(ev['Start Date'])}${ev['End Date'] && ev['End Date'] !== ev['Start Date'] ? ' – ' + fmtDate(ev['End Date']) : ''}</span>
            ${ev['Location'] ? `<span>📍 ${escapeHtml(ev['Location'])}</span>` : ''}
          </div>
          ${ev['Description'] ? `<div class="desc">${escapeHtml(ev['Description'])}</div>` : ''}
          <p class="helper">Event ID: ${escapeHtml(ev['Event ID'])}</p>
          <div style="margin:10px 0;">
            <div style="font-weight:600; font-size:13px; margin-bottom:6px;">Seva under this event (${evSeva.length}${isSuperAdmin ? '' : ' — your type'})</div>
            ${evSeva.length ? evSeva.map(s => `
              <div class="reg-row">
                <div class="who">${escapeHtml(s['Seva Name'])}<br><span class="m">${fmtDate(s['Date'])} · ${s.RegisteredCount}/${s['Max Volunteers'] || '—'} registered${s['Recurring Pattern ID'] ? ' · recurring' : ''} · ${escapeHtml(s['Status'])}</span></div>
                <button class="btn btn-outline small" data-edit-event-seva="${escapeHtml(s['Seva ID'])}">Edit</button>
              </div>
            `).join('') : '<p class="muted">No seva added yet.</p>'}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-ghost small" data-add-seva-event="${escapeHtml(ev['Event ID'])}">+ Add Seva</button>
            <button class="btn btn-outline small" data-edit-event="${escapeHtml(ev['Event ID'])}">Edit Event</button>
          </div>
        </div>
      `; }).join('') : '<div class="empty">No events yet.</div>'}
    `;

    document.getElementById('new-event-btn').addEventListener('click', () => openEventModal(null, showEvents));
    body.querySelectorAll('[data-edit-event]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = events.find(e => String(e['Event ID']) === btn.dataset.editEvent);
        openEventModal(ev, showEvents);
      });
    });
    body.querySelectorAll('[data-add-seva-event]').forEach(btn => {
      btn.addEventListener('click', () => openSevaModal({ eventId: btn.dataset.addSevaEvent }, showEvents));
    });
    body.querySelectorAll('[data-edit-event-seva]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = seva.find(x => String(x['Seva ID']) === btn.dataset.editEventSeva);
        openSevaModal(s || {}, showEvents);
      });
    });
  }

  function openEventModal(existing, onDone) {
    const isEdit = !!existing;
    const overlay = openModal(`
      <div class="sheet-head"><h3>${isEdit ? 'Edit Event' : 'New Event'}</h3><button class="close-x" id="modal-close">✕</button></div>
      <div class="field"><label>Event Name</label><input id="ev-name" value="${isEdit ? escapeHtml(existing['Event Name']) : ''}"></div>
      <div class="field"><label>Description</label><textarea id="ev-desc" rows="2">${isEdit ? escapeHtml(existing['Description']) : ''}</textarea></div>
      <div class="row-2">
        <div class="field"><label>Start Date</label><input id="ev-start" type="date" value="${isEdit ? escapeHtml(fmtInputDate(existing['Start Date'])) : ''}"></div>
        <div class="field"><label>End Date</label><input id="ev-end" type="date" value="${isEdit ? escapeHtml(fmtInputDate(existing['End Date'])) : ''}"></div>
      </div>
      <div class="field"><label>Location</label><input id="ev-location" value="${isEdit ? escapeHtml(existing['Location']) : ''}"></div>
      ${isEdit ? `
      <div class="field"><label>Status</label>
        <select id="ev-status">
          <option value="ACTIVE" ${existing['Status'] === 'ACTIVE' ? 'selected' : ''}>Active</option>
          <option value="CANCELLED" ${existing['Status'] === 'CANCELLED' ? 'selected' : ''}>Cancelled</option>
          <option value="COMPLETED" ${existing['Status'] === 'COMPLETED' ? 'selected' : ''}>Completed</option>
        </select>
      </div>` : ''}
      <button class="btn btn-primary" id="ev-submit">${isEdit ? 'Save Changes' : 'Create Event'}</button>
      <div id="ev-msg"></div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#ev-submit').addEventListener('click', async () => {
      const payload = {
        pin,
        name: overlay.querySelector('#ev-name').value.trim(),
        description: overlay.querySelector('#ev-desc').value.trim(),
        startDate: overlay.querySelector('#ev-start').value,
        endDate: overlay.querySelector('#ev-end').value,
        location: overlay.querySelector('#ev-location').value.trim()
      };
      try {
        if (isEdit) {
          payload.eventId = existing['Event ID'];
          payload.status = overlay.querySelector('#ev-status').value;
          await api.post('updateEvent', payload);
          toast('Event updated.');
        } else {
          await api.post('createEvent', payload);
          toast('Event created.');
        }
        bustCache();
        overlay.remove();
        if (onDone) onDone();
      } catch (e) { overlay.querySelector('#ev-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
    });
  }

  // ---- Recurring Seva (weekly or "Nth weekday of month") ----
  // Any admin can see and manage this now: a scoped admin only sees/creates
  // patterns for their own Seva Type (enforced server-side), Super Admin sees all.
  async function showRecurring() {
    paintTabs('recurring');
    body.innerHTML = skeletons(2);
    const [patterns, events] = await Promise.all([
      cachedGet('allRecurringPatterns:' + pin, () => api.get('allRecurringPatterns', { pin }), 8000),
      cachedGet('allEvents:' + pin, () => api.get('allEvents', { pin }), 8000)
    ]);
    const eventName = (id) => { const ev = events.find(e => String(e['Event ID']) === String(id)); return ev ? ev['Event Name'] : null; };
    body.innerHTML = `
      <button class="btn btn-primary" id="new-recur-btn" style="margin-bottom:10px;">+ New Recurring Seva</button>
      <button class="btn btn-ghost" id="generate-recur-btn" style="margin-bottom:14px;">Generate Occurrences Now</button>
      ${patterns.length ? patterns.map(p => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div class="card-title">${escapeHtml(p['Seva Name'])}</div>
            <span class="badge ${String(p['Active']).toUpperCase() === 'TRUE' ? 'open' : 'full'}">${String(p['Active']).toUpperCase() === 'TRUE' ? 'ACTIVE' : 'PAUSED'}</span>
          </div>
          <div class="meta">
            <span>${describePattern(p)}</span>
            ${p['Start Time'] ? `<span>⏰ ${fmtTime(p['Start Time'])}${p['End Time'] ? '–' + fmtTime(p['End Time']) : ''}</span>` : ''}
            ${p['Location'] ? `<span>📍 ${escapeHtml(p['Location'])}</span>` : ''}
            ${p['Event ID'] && eventName(p['Event ID']) ? `<span class="badge event">${escapeHtml(eventName(p['Event ID']))}</span>` : ''}
          </div>
          <button class="btn btn-outline small" data-toggle-pattern="${escapeHtml(p['Pattern ID'])}" data-active="${String(p['Active']).toUpperCase()}">
            ${String(p['Active']).toUpperCase() === 'TRUE' ? 'Pause' : 'Resume'}
          </button>
        </div>
      `).join('') : '<div class="empty">No recurring seva set up yet.</div>'}
    `;
    document.getElementById('new-recur-btn').addEventListener('click', () => openRecurringModal(events));
    document.getElementById('generate-recur-btn').addEventListener('click', async () => {
      try {
        const result = await api.post('generateRecurringOccurrences', { pin });
        bustCache();
        toast(`${result.created} seva occurrence(s) generated.`);
      } catch (e) { toast(e.message); }
    });
    body.querySelectorAll('[data-toggle-pattern]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          const makeActive = btn.dataset.active !== 'TRUE';
          await api.post('updateRecurringPattern', { pin, patternId: btn.dataset.togglePattern, active: makeActive });
          bustCache();
          showRecurring();
        } catch (e) { toast(e.message); }
      });
    });
  }

  function describePattern(p) {
    const dow = DOW_NAMES[Number(p['Day Of Week'])] || '';
    if (String(p['Recurrence Type']).toUpperCase() === 'MONTHLY_NTH') {
      const nth = p['Week Of Month'];
      const label = String(nth).toUpperCase() === 'LAST' ? 'Last' : { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th' }[nth] || nth;
      return `🗓 ${label} ${dow} of every month`;
    }
    return `🔁 Every ${dow}`;
  }

  // events: the already-fetched event list, so this can offer an optional
  // "attach to an event" dropdown without a separate round trip.
  function openRecurringModal(events) {
    const overlay = openModal(`
      <div class="sheet-head"><h3>New Recurring Seva</h3><button class="close-x" id="modal-close">✕</button></div>
      ${isSuperAdmin ? `<div class="field"><label>Seva Type ID</label><input id="rp-type" placeholder="e.g. ST_ABC123"></div>` : ''}
      <div class="field"><label>Event (optional)</label>
        <select id="rp-event">
          <option value="">Standalone — not tied to an event</option>
          ${(events || []).map(ev => `<option value="${escapeHtml(ev['Event ID'])}">${escapeHtml(ev['Event Name'])}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Seva Name</label><input id="rp-name"></div>
      <div class="field"><label>Repeats</label>
        <select id="rp-recurtype">
          <option value="WEEKLY">Every week</option>
          <option value="MONTHLY_NTH" selected>One specific week each month</option>
        </select>
      </div>
      <div class="row-2">
        <div class="field"><label>Day of Week</label>
          <select id="rp-dow">${DOW_NAMES.map((d, i) => `<option value="${i}" ${i === 0 ? 'selected' : ''}>${d}</option>`).join('')}</select>
        </div>
        <div class="field" id="rp-week-wrap">
          <label>Which week</label>
          <select id="rp-week">
            <option value="1" selected>1st</option><option value="2">2nd</option><option value="3">3rd</option>
            <option value="4">4th</option><option value="LAST">Last</option>
          </select>
        </div>
      </div>
      <div class="row-2">
        <div class="field"><label>Start Time</label><input id="rp-start" type="time"></div>
        <div class="field"><label>End Time</label><input id="rp-end" type="time"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Location</label><input id="rp-location"></div>
        <div class="field"><label>Max Volunteers</label><input id="rp-max" type="number"></div>
      </div>
      <button class="btn btn-primary" id="rp-submit">Create Recurring Seva</button>
      <p class="helper">"One specific week each month" (e.g. 2nd Sunday) suits most monthly seva. Pick "Every week" for something like every Sunday instead.</p>
      <div id="rp-msg"></div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
    const recurTypeEl = overlay.querySelector('#rp-recurtype');
    const weekWrap = overlay.querySelector('#rp-week-wrap');
    const syncRecurType = () => { weekWrap.style.display = recurTypeEl.value === 'MONTHLY_NTH' ? 'block' : 'none'; };
    recurTypeEl.addEventListener('change', syncRecurType);
    syncRecurType();
    overlay.querySelector('#rp-submit').addEventListener('click', async () => {
      const payload = {
        pin,
        eventId: overlay.querySelector('#rp-event').value,
        name: overlay.querySelector('#rp-name').value.trim(),
        recurrenceType: recurTypeEl.value,
        dayOfWeek: overlay.querySelector('#rp-dow').value,
        weekOfMonth: overlay.querySelector('#rp-week').value,
        startTime: overlay.querySelector('#rp-start').value,
        endTime: overlay.querySelector('#rp-end').value,
        location: overlay.querySelector('#rp-location').value.trim(),
        maxVolunteers: overlay.querySelector('#rp-max').value
      };
      if (isSuperAdmin) payload.sevaTypeId = overlay.querySelector('#rp-type').value.trim();
      try {
        const result = await api.post('createRecurringPattern', payload);
        bustCache();
        overlay.remove();
        toast(`Recurring seva created — ${result.created} date${result.created === 1 ? '' : 's'} already scheduled.`);
        showRecurring();
      } catch (e) { overlay.querySelector('#rp-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
    });
  }

  // ---- Reports — Super Admin only ----
  async function showReports() {
    paintTabs('reports');
    body.innerHTML = `
      <div class="pill-toggle">
        <button class="btn btn-ghost small" data-report="seva">Seva-wise</button>
        <button class="btn btn-ghost small" data-report="participant">Participant-wise</button>
        <button class="btn btn-ghost small" data-report="event">Event-wise</button>
      </div>
      <div id="report-table"><p class="muted">Choose a report above.</p></div>
    `;
    body.querySelectorAll('[data-report]').forEach(b => {
      b.addEventListener('click', async () => {
        const type = b.dataset.report;
        const table = document.getElementById('report-table');
        table.innerHTML = skeletons(1);
        const data = await api.get('reports', { pin, type });
        if (!data.length) { table.innerHTML = '<p class="muted">No data.</p>'; return; }
        const cols = Object.keys(data[0]);
        table.innerHTML = `<table class="simple"><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>${data.map(row => `<tr>${cols.map(c => `<td>${escapeHtml(row[c])}</td>`).join('')}</tr>`).join('')}</table>`;
      });
    });
  }

  content.querySelectorAll('[data-sa-view]').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.saView === 'overview') showOverview();
      else if (b.dataset.saView === 'seva') showSeva();
      else if (b.dataset.saView === 'events') showEvents();
      else if (b.dataset.saView === 'recurring') showRecurring();
      else showReports();
    });
  });

  if (isSuperAdmin) showOverview(); else showSeva();
}

function fmtInputDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return '';
  return dt.toISOString().slice(0, 10);
}

/* ---------------- Boot ---------------- */
setTab('home');
</script>
</body>
</html>
