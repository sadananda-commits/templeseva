const DOW_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

// Drives both the Super Admin dashboard and the scoped Admin dashboard from one
// place. Scoped admins get a smaller tab set ("My Seva" instead of "Seva", no
// Overview/Reports) and are locked to their own Seva Type when creating seva or
// recurring patterns — but both roles can create Events, add Seva Opportunities
// (one-time or recurring) under them, and manage their own recurring patterns.
async function renderAdminDashboard(content, pin, isSuperAdmin, overview) {
  const tabs = isSuperAdmin
    ? [['overview', 'Overview'], ['seva', 'Seva'], ['events', 'Events'], ['recurring', 'Recurring'], ['participants', 'Participants'], ['reports', 'Reports']]
    : [['seva', 'My Seva'], ['events', 'Events'], ['recurring', 'Recurring']];

  content.innerHTML = `
    <div class="pill-toggle">
      ${tabs.map(t => `<button class="btn small ${t[0] === tabs[0][0] ? 'btn-primary' : 'btn-ghost'}" data-sa-view="${t[0]}">${t[1]}</button>`).join('')}
    </div>
    <div id="sa-body"></div>
  `;
  const body = content.querySelector('#sa-body');
  // Shared across the Seva and Events sub-tabs: OFF by default (today +
  // upcoming only, ascending), so admins see the same "what's actually
  // coming up" view as participants unless they deliberately ask for
  // history. Resets to OFF each time the Admin tab is re-entered.
  let showHistory = false;

  function historyToggleHtml() {
    return `<label class="history-toggle" style="display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; user-select:none;">
      <input type="checkbox" id="sa-show-history" ${showHistory ? 'checked' : ''}> Show History
    </label>`;
  }
  function bindHistoryToggle(refresh) {
    const cb = body.querySelector('#sa-show-history');
    if (!cb) return;
    cb.addEventListener('change', () => { showHistory = cb.checked; refresh(); });
  }
  // Filters a list of date-bearing rows (Seva Opportunities or Events) down
  // to today-and-upcoming, ascending by date -- unless showHistory is on,
  // in which case everything is returned, still ascending, so past rows
  // simply appear at the top rather than being sorted separately.
  function filterAndSortByDate(list, dateField) {
    const today = todayLocalStr();
    const withDate = list.filter(function (row) { return row[dateField]; });
    const visible = showHistory ? withDate : withDate.filter(function (row) { return String(row[dateField]) >= today; });
    return visible.sort(function (a, b) { return String(a[dateField]).localeCompare(String(b[dateField])); });
  }

  function paintTabs(active) {
    content.querySelectorAll('[data-sa-view]').forEach(b => {
      b.className = 'btn small ' + (b.dataset.saView === active ? 'btn-primary' : 'btn-ghost');
    });
  }

  // ---- Overview (super admin only) ----
  // Condensed, expandable row: one seva occurrence per summary row (date +
  // time sorted, see getSuperAdminOverview_), opening to the full registrant
  // list -- name, mobile, and the same status pill used everywhere else.
  function overviewSevaRow(s) {
    const max = Number(s.maxVolunteers) || 0;
    const count = s.registeredCount || 0;
    const full = s.isFull;
    const slotsText = max > 0 ? `${count}/${max}` : `${count}`;
    const timeText = s.startTime ? `${fmtTime(s.startTime)}${s.endTime ? '–' + fmtTime(s.endTime) : ''}` : '';
    const registrantRows = s.registrants.length
      ? s.registrants.map(p => `
          <div class="reg-row">
            <div class="who">${escapeHtml(p.name)}<br><span class="m">${escapeHtml(p.mobile)}</span></div>
            ${statusPill(p.displayStatus)}
          </div>`).join('')
      : '<p class="muted" style="padding:8px 0;">No registrations yet.</p>';
    return `
      <tr class="row-summary" data-overview-seva-row="${escapeHtml(s.sevaId)}">
        <td class="name-cell"><span class="row-chevron">▸</span>${escapeHtml(s.sevaName)}${s.isRecurring ? '<span class="sub">Recurring</span>' : ''}</td>
        <td>${fmtDate(s.date)}${timeText ? `<span class="sub">${timeText}</span>` : ''}</td>
        <td><span class="slot-text ${full ? 'full' : 'ok'}">${slotsText}</span></td>
      </tr>
      <tr class="row-detail hidden"><td colspan="3">
        ${s.location ? `<div class="muted" style="margin:8px 0 4px;">📍 ${escapeHtml(s.location)}</div>` : ''}
        ${registrantRows}
      </td></tr>
    `;
  }

  function showOverview() {
    paintTabs('overview');
    body.innerHTML = `
      <h3 style="margin-bottom:10px;">Seva Summary</h3>
      ${overview.sevaSummary.length
        ? tableShell(['Seva', 'Date & Time', 'Registered'], overview.sevaSummary.map(overviewSevaRow).join(''))
        : '<div class="empty">No upcoming seva scheduled.</div>'}
      <h3 style="margin:16px 0 10px;">Upcoming Events</h3>
      ${overview.upcomingEvents.length ? `<div class="card-grid">${overview.upcomingEvents.map(ev => `
        <div class="card">
          <div class="card-title">${escapeHtml(ev.eventName)}</div>
          <div class="meta"><span>${ev.sevaOpportunities} seva</span><span>${ev.registrations} registrations</span><span>${ev.vacantSlots} vacant</span></div>

  // Returns the seva list this role is allowed to see/manage: everything for
  // Super Admin, only their assigned Seva Type's rows for a scoped Admin.
  async function fetchSevaList() {
    if (isSuperAdmin) return await cachedGet('allSeva:' + pin, () => api.get('allSeva', { pin }), 8000);
    return await cachedGet('adminSeva:' + pin, () => api.get('adminSeva', { pin }), 8000);
  }

  // Shared registrant row for both the super-admin and scoped-admin seva card
  // views below -- one participant's booking, with admin-only actions. This
  // is the only place cancel/reschedule of an individual's registration is
  // exposed in the UI (participants themselves only get Change Date, and
  // only within the same recurring pattern -- see My Seva).
  function regRowAdmin(r) {
    return `
      <div class="reg-row">
        <div class="who">${escapeHtml(r['Participant Name'])}<br><span class="m">${escapeHtml(r['Mobile Number'])}${r['Attendance Status'] && r['Attendance Status'] !== 'PENDING' ? ' · ' + escapeHtml(r['Attendance Status']) : ''}</span></div>
        <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
          ${statusPill(r.displayStatus)}
          <button class="btn btn-outline small" data-attend="${escapeHtml(r['Registration ID'])}">Mark Attended</button>
          <button class="btn btn-ghost small" data-admin-reschedule="${escapeHtml(r['Registration ID'])}" data-current-seva="${escapeHtml(r['Seva ID'])}">Change Date</button>
          <button class="btn btn-danger small" data-admin-remove="${escapeHtml(r['Registration ID'])}">Remove</button>
        </div>
      </div>
    `;
  }

  function wireSevaCardActions(scopeEl, sevaList, refresh) {
    scopeEl.querySelectorAll('[data-attend]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await api.post('markAttendance', { pin, registrationId: btn.dataset.attend, status: 'ATTENDED' });
          bustCache();
          toast('Marked attended.');
          refresh();
        } catch (e) { toast(e.message); }
      });
    });
    scopeEl.querySelectorAll('[data-add-participant]').forEach(btn => {
      btn.addEventListener('click', () => openAdminAddParticipantModal(btn.dataset.addParticipant, refresh));
    });
    scopeEl.querySelectorAll('[data-edit-seva]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = sevaList.find(x => String(x['Seva ID']) === btn.dataset.editSeva);
        openSevaModal(s || {}, refresh);
      });
    });
    scopeEl.querySelectorAll('[data-cancel-seva]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Cancel this seva opportunity? Existing registrants stay on record, but no new signups will be allowed.')) return;
        try {
          await api.post('cancelSeva', { pin, sevaId: btn.dataset.cancelSeva });
          bustCache();
          toast('Seva cancelled.');
          refresh();
        } catch (e) { toast(e.message); }
      });
    });
    // Admin-only registration-level actions: move a participant to a
    // different date/seva, or remove their registration outright. Ownership
    // scoping (a scoped admin can only touch their own Seva Type's rows) is
    // enforced server-side by assertSevaInScope_ -- see moveParticipant_ and
    // adminRemoveRegistration_ in 4_Api_Write.gs.
    scopeEl.querySelectorAll('[data-admin-reschedule]').forEach(btn => {
      btn.addEventListener('click', () => {
        openAdminRescheduleModal({
          pin, sevaList, refresh,
          registrationId: btn.dataset.adminReschedule,
          currentSevaId: btn.dataset.currentSeva
        });
      });
    });
    scopeEl.querySelectorAll('[data-admin-remove]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remove this registration? The participant will no longer be booked for this seva.')) return;
        try {
          await api.post('adminRemoveRegistration', { pin, registrationId: btn.dataset.adminRemove });
          bustCache();
          toast('Registration removed.');
          refresh();
        } catch (e) { toast(e.message); }
      });
    });
  }

  // "Add Participant" from a seva card. Existing participant: search by
  // name (no mobile re-entry or verification -- the admin is already
  // authenticated and picking a specific, already-known record). New
  // participant: name + mobile, which becomes that person's sign-in for the
  // participant portal (see findOrCreateParticipant_ in 4_Api_Write.gs).
  function openAdminAddParticipantModal(sevaId, refresh) {
    const overlay = openModal(`
      <div class="sheet-head"><h3>Add Participant</h3><button class="close-x" id="modal-close">✕</button></div>
      <div style="padding:0 20px 20px;">
        <div class="pill-toggle" style="margin-bottom:14px;">
          <button type="button" class="btn small btn-primary" id="aap-tab-existing">Existing Participant</button>
          <button type="button" class="btn small btn-ghost" id="aap-tab-new">New Participant</button>
        </div>
        <div id="aap-body"></div>
      </div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
    const modalBody = overlay.querySelector('#aap-body');
    const tabExisting = overlay.querySelector('#aap-tab-existing');
    const tabNew = overlay.querySelector('#aap-tab-new');

    function renderExistingTab() {
      tabExisting.className = 'btn small btn-primary';
      tabNew.className = 'btn small btn-ghost';
      modalBody.innerHTML = `
        <div class="field"><label>Search participant by name</label><input type="text" id="aap-search" placeholder="Start typing a name…"></div>
        <div id="aap-results"></div>
      `;
      let searchTimer;
      modalBody.querySelector('#aap-search').addEventListener('input', e => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        const resultsEl = modalBody.querySelector('#aap-results');
        if (q.length < 2) { resultsEl.innerHTML = ''; return; }
        searchTimer = setTimeout(async () => {
          const results = await api.get('searchParticipants', { q });
          resultsEl.innerHTML = results.length ? `<div class="result-list">${results.map(r => `
            <div class="result-item" data-pid="${escapeHtml(r['Participant ID'])}" data-name="${escapeHtml(r['Full Name'])}">
              <div class="r-name">${escapeHtml(r['Full Name'])}</div>
              <div class="r-mobile">Mobile ending ${escapeHtml(r['Mobile Masked'])}</div>
            </div>`).join('')}</div>` : `<p class="muted" style="margin-top:6px;">No match found.</p>`;
          resultsEl.querySelectorAll('.result-item').forEach(item => {
            item.addEventListener('click', async () => {
              try {
                await api.post('adminAddParticipant', { pin, sevaId, participantId: item.dataset.pid });
                bustCache();
                overlay.remove();
                toast(`${item.dataset.name} added. 🙏`);
                refresh();
              } catch (e) {
                resultsEl.insertAdjacentHTML('beforeend', `<div class="error-text">${escapeHtml(e.message)}</div>`);
              }
            });
          });
        }, 180);
      });
    }

    function renderNewTab() {
      tabExisting.className = 'btn small btn-ghost';
      tabNew.className = 'btn small btn-primary';
      modalBody.innerHTML = `
        <div class="field"><label>Full Name</label><input id="aap-name"></div>
        <div class="field"><label>Mobile Number</label><input id="aap-mobile" type="tel" inputmode="numeric" placeholder="Enter the 8 digit mobile number" maxlength="8"></div>
        <p class="muted" style="margin:6px 0 12px;">This mobile number becomes their sign-in when they visit the participant portal.</p>
        <button class="btn btn-primary" id="aap-submit">Add & Register</button>
        <div id="aap-msg"></div>
      `;
      modalBody.querySelector('#aap-submit').addEventListener('click', async () => {
        const fullName = modalBody.querySelector('#aap-name').value.trim();
        const mobile = modalBody.querySelector('#aap-mobile').value.trim();
        try {
          await api.post('adminAddParticipant', { pin, sevaId, fullName, mobile });
          bustCache();
          overlay.remove();
          toast(`${fullName} added. 🙏`);
          refresh();
        } catch (e) {
          modalBody.querySelector('#aap-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`;
        }
      });
    }

    tabExisting.addEventListener('click', renderExistingTab);
    tabNew.addEventListener('click', renderNewTab);
    renderExistingTab();
  }


  // ACTIVE seva currently visible to them (the same sevaList already loaded
  // for this screen -- already correctly scoped to "my Seva Type" for a
  // scoped admin, or everything for Super Admin, so no extra fetch needed).
  // Unlike the participant-facing My Seva "Change Date", this is NOT limited
  // to the same recurring pattern -- an admin can move someone to any seva.
  function openAdminRescheduleModal(ctx) {
    const today = todayLocalStr();
    // Never offer a past date as a reschedule target, even if the caller's
    // sevaList currently includes history (admin had "Show History" on) --
    // moving someone's registration into the past never makes sense.
    const candidates = ctx.sevaList
      .filter(s => String(s['Seva ID']) !== String(ctx.currentSevaId) && String(s['Status']).toUpperCase() === 'ACTIVE' && String(s['Date']) >= today)
      .sort((a, b) => String(a['Date']).localeCompare(String(b['Date'])));
    const overlay = openModal(`
      <div class="sheet-head"><h3>Change Date</h3><button class="close-x" id="modal-close">✕</button></div>
      <div id="modal-body">
        ${candidates.length ? `
          <p class="muted" style="margin-bottom:8px;">Move this registration to:</p>
          <div class="result-list" id="admin-date-options">
            ${candidates.map(s => `
              <div class="result-item" data-seva-option="${escapeHtml(s['Seva ID'])}">
                <div class="r-name">${escapeHtml(s['Seva Name'])} — ${escapeHtml(fmtDate(s['Date']))}</div>
                <div class="r-mobile">${s.RegisteredCount}/${s['Max Volunteers'] || '—'} registered</div>
              </div>
            `).join('')}
          </div>
          <button class="btn btn-primary" id="admin-reschedule-submit" style="margin-top:12px;" disabled>Confirm New Date</button>
        ` : '<p class="muted">No other active seva available to move to.</p>'}
        <div id="modal-msg"></div>
      </div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
    let selectedSevaId = null;
    overlay.querySelectorAll('[data-seva-option]').forEach(item => {
      item.addEventListener('click', () => {
        overlay.querySelectorAll('[data-seva-option]').forEach(o => o.classList.remove('selected'));
        item.classList.add('selected');
        selectedSevaId = item.dataset.sevaOption;
        const submitBtn = overlay.querySelector('#admin-reschedule-submit');
        if (submitBtn) submitBtn.disabled = false;
      });
    });
    const submitBtn = overlay.querySelector('#admin-reschedule-submit');
    if (submitBtn) {
      submitBtn.addEventListener('click', async (e) => {
        if (!selectedSevaId) return;
        await withBusyButton(e.currentTarget, 'Saving…', async () => {
          try {
            await api.post('moveParticipant', { pin: ctx.pin, registrationId: ctx.registrationId, newSevaId: selectedSevaId });
            bustCache();
            overlay.querySelector('#modal-msg').innerHTML = `<div class="success-text">Moved! 🙏</div>`;
            setTimeout(() => { overlay.remove(); ctx.refresh(); }, 800);
          } catch (e) {
            overlay.querySelector('#modal-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`;
          }
        });
      });
    }
  }

  // ---- Seva ("Seva" for Super Admin, "My Seva" for a scoped Admin) ----
  async function showSeva() {
    paintTabs('seva');
    body.innerHTML = skeletons(2);
    const allSeva = await fetchSevaList();
    // Today-and-upcoming by default, ascending; "Show History" reveals past
    // dated seva too (still ascending, so it simply appears at the top).
    const seva = filterAndSortByDate(allSeva, 'Date');

    // Small info table + two highlighted blocks (Contact, Notes) shared by
    // both the Super Admin and scoped-admin card views below, so a seva card
    // reads the same way everywhere. Contact and Notes only render when
    // there's actually something in them -- an empty highlighted box with
    // nothing to say is just noise.
    function sevaCardBody(s) {
      const timeText = s['Start Time'] ? `${fmtTime(s['Start Time'])}${s['End Time'] ? '–' + fmtTime(s['End Time']) : ''}` : '—';
      const rows = [
        ['Date', escapeHtml(fmtDate(s['Date']))],
        ['Time', escapeHtml(timeText)],
        ['Location', escapeHtml(s['Location'] || '—')],
        ['Registered', `${s.RegisteredCount}${s['Max Volunteers'] ? '/' + escapeHtml(String(s['Max Volunteers'])) : ''}`],
        ['Status', escapeHtml(s['Status'] || '')]
      ];
      const infoTable = `<table class="seva-info-table">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
      const hasContact = s['Contact Person'] || s['Contact Number'];
      const contactBlock = hasContact ? `
        <div class="seva-highlight contact">
          <span class="icon">📞</span>
          <div><strong>Contact:</strong> ${escapeHtml(s['Contact Person'] || '')}${s['Contact Number'] ? ' · ' + escapeHtml(s['Contact Number']) : ''}</div>
        </div>` : '';
      const notesBlock = s['Instructions'] ? `
        <div class="seva-highlight notes">
          <span class="icon">📝</span>
          <div><strong>Notes:</strong> ${escapeHtml(s['Instructions'])}</div>
        </div>` : '';
      return infoTable + contactBlock + notesBlock;
    }

    const headerBar = `<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
      <button class="btn btn-primary" id="new-seva-btn">+ New Seva Opportunity</button>
      ${historyToggleHtml()}
    </div>`;

    if (isSuperAdmin) {
      body.innerHTML = `
        ${headerBar}
        ${seva.length ? `<div class="card-grid">${seva.map(s => `
          <div class="card">
            <div class="card-title">${escapeHtml(s['Seva Name'])}</div>
            ${sevaCardBody(s)}
            <div style="margin:10px 0;">
              ${(s.Registrations || []).map(regRowAdmin).join('') || '<p class="muted">No registrations yet.</p>'}
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn btn-ghost small" data-add-participant="${escapeHtml(s['Seva ID'])}">+ Add Participant</button>
              <button class="btn btn-outline small" data-edit-seva="${escapeHtml(s['Seva ID'])}">Edit</button>
              <button class="btn btn-danger small" data-cancel-seva="${escapeHtml(s['Seva ID'])}">Cancel</button>
            </div>
          </div>
        `).join('')}</div>` : `<div class="empty">${showHistory ? 'No seva opportunities on record.' : 'No upcoming seva opportunities — create one above, or turn on Show History to see past ones.'}</div>`}
      `;
      document.getElementById('new-seva-btn').addEventListener('click', () => openSevaModal({}, showSeva));
      bindHistoryToggle(showSeva);
      wireSevaCardActions(body, seva, showSeva);
      return;
    }

    // Scoped admin: card view with registrations + attendance, same as before,
    // plus the ability to create/edit/cancel seva of their own assigned type.
    body.innerHTML = `
      ${headerBar}
      ${seva.length ? `<div class="card-grid">${seva.map(s => `
        <div class="card">
          <div class="card-title">${escapeHtml(s['Seva Name'])}</div>
          ${sevaCardBody(s)}
          <div style="margin:10px 0;">
            ${s.Registrations.map(regRowAdmin).join('') || '<p class="muted">No registrations yet.</p>'}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-ghost small" data-add-participant="${escapeHtml(s['Seva ID'])}">+ Add Participant</button>
            <button class="btn btn-outline small" data-edit-seva="${escapeHtml(s['Seva ID'])}">Edit</button>
            <button class="btn btn-danger small" data-cancel-seva="${escapeHtml(s['Seva ID'])}">Cancel</button>
          </div>
        </div>
      `).join('')}</div>` : `<div class="empty">${showHistory ? 'No seva opportunities of your type on record.' : 'No upcoming seva opportunities of your type — create one above, or turn on Show History to see past ones.'}</div>`}
    `;
    document.getElementById('new-seva-btn').addEventListener('click', () => openSevaModal({}, showSeva));
    bindHistoryToggle(showSeva);
    wireSevaCardActions(body, seva, showSeva);
  }

  // Shared create/edit modal for a Seva Opportunity. When creating (not editing),
  // this also covers recurring seva -- Frequency picks between a single date,
  // every week, or one specific week each month (e.g. "2nd Sunday"), so a single
  // form handles both once-off and recurring seva under an event.
  // existing: {} for a brand-new standalone seva, {eventId} when adding a seva
  // under a specific event, or a full seva row (from allSeva/adminSeva) to edit.
  function openSevaModal(existing, onDone) {
    const isEdit = !!existing['Seva ID'];
    const eventId = existing.eventId || '';
    const overlay = openModal(`
      <div class="sheet-head"><h3>${isEdit ? 'Edit Seva Opportunity' : 'New Seva'}</h3><button class="close-x" id="modal-close">✕</button></div>
      ${isSuperAdmin ? `<div class="field"><label>Seva Type ID</label><input id="ns-type" value="${isEdit ? escapeHtml(existing['Seva Type ID']) : ''}" placeholder="e.g. ST_ABC123"></div>` : ''}
      ${!isEdit && !eventId ? `<div class="field"><label>Event ID (optional)</label><input id="ns-event" placeholder="Leave blank for a standalone / ad-hoc seva"></div>` : ''}
      ${eventId ? `<p class="helper">Adding this under the event you selected.</p>` : ''}
      <div class="field"><label>Seva Name</label><input id="ns-name" value="${isEdit ? escapeHtml(existing['Seva Name']) : ''}"></div>
      ${isEdit ? `
      <div class="field"><label>Date</label><input id="ns-date" type="date" value="${fmtInputDate(existing['Date'])}"></div>
      ` : `
      <div class="field"><label>Frequency</label>
        <select id="ns-freq">
          <option value="ONCE">Just one date</option>
          <option value="WEEKLY">Every week</option>
          <option value="MONTHLY_NTH" selected>One specific week each month</option>
        </select>
      </div>
      <div id="ns-once-wrap" style="display:none;">
        <div class="field"><label>Date</label><input id="ns-date" type="date"></div>
      </div>
      <div id="ns-recur-wrap" class="row-2">
        <div class="field"><label>Day of Week</label>
          <select id="ns-dow">${DOW_NAMES.map((d, i) => `<option value="${i}" ${i === 0 ? 'selected' : ''}>${d}</option>`).join('')}</select>
        </div>
        <div class="field" id="ns-week-wrap">
          <label>Which week</label>
          <select id="ns-week">
            <option value="1" selected>1st</option><option value="2">2nd</option><option value="3">3rd</option>
            <option value="4">4th</option><option value="LAST">Last</option>
          </select>
        </div>
      </div>
      `}
      <div class="row-2">
        <div class="field"><label>Start Time</label><input id="ns-start" type="time" value="${isEdit ? fmtTimeInput(existing['Start Time']) : ''}"></div>
        <div class="field"><label>End Time</label><input id="ns-end" type="time" value="${isEdit ? fmtTimeInput(existing['End Time']) : ''}"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Location</label><input id="ns-location" value="${isEdit ? escapeHtml(existing['Location']) : ''}"></div>
        <div class="field"><label>Max Volunteers</label><input id="ns-max" type="number" value="${isEdit ? escapeHtml(existing['Max Volunteers']) : ''}"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Contact Person</label><input id="ns-contact-person" value="${isEdit ? escapeHtml(existing['Contact Person']) : ''}" placeholder="Optional"></div>
        <div class="field"><label>Contact Number</label><input id="ns-contact-number" value="${isEdit ? escapeHtml(existing['Contact Number']) : ''}" placeholder="Optional"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="ns-instructions" rows="2" placeholder="Optional — anything volunteers or fellow admins should know">${isEdit ? escapeHtml(existing['Instructions']) : ''}</textarea></div>
      <button class="btn btn-primary" id="ns-submit">${isEdit ? 'Save Changes' : 'Create'}</button>
      ${!isEdit ? '<p class="helper">"One specific week each month" (e.g. 2nd Sunday) is the usual choice for a monthly seva. Pick "Every week" for a weekly seva like every Sunday, or "Just one date" for a single occurrence.</p>' : ''}
      <div id="ns-msg"></div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());

    if (!isEdit) {
      const freqEl = overlay.querySelector('#ns-freq');
      const onceWrap = overlay.querySelector('#ns-once-wrap');
      const recurWrap = overlay.querySelector('#ns-recur-wrap');
      const weekWrap = overlay.querySelector('#ns-week-wrap');
      const syncFreq = () => {
        const v = freqEl.value;
        onceWrap.style.display = v === 'ONCE' ? 'block' : 'none';
        recurWrap.style.display = v === 'ONCE' ? 'none' : 'grid';
        weekWrap.style.display = v === 'MONTHLY_NTH' ? 'block' : 'none';
      };
      freqEl.addEventListener('change', syncFreq);
      syncFreq();
    }

    overlay.querySelector('#ns-submit').addEventListener('click', async () => {
      const freq = isEdit ? 'ONCE' : overlay.querySelector('#ns-freq').value;
      const common = {
        pin,
        name: overlay.querySelector('#ns-name').value.trim(),
        startTime: overlay.querySelector('#ns-start').value,
        endTime: overlay.querySelector('#ns-end').value,
        location: overlay.querySelector('#ns-location').value.trim(),
        maxVolunteers: overlay.querySelector('#ns-max').value,
        contactPerson: overlay.querySelector('#ns-contact-person').value.trim(),
        contactNumber: overlay.querySelector('#ns-contact-number').value.trim(),
        instructions: overlay.querySelector('#ns-instructions').value.trim()
      };
      if (isSuperAdmin && overlay.querySelector('#ns-type')) common.sevaTypeId = overlay.querySelector('#ns-type').value.trim();
      try {
        if (isEdit) {
          await api.post('updateSeva', Object.assign(common, { sevaId: existing['Seva ID'], date: overlay.querySelector('#ns-date').value }));
          toast('Seva opportunity updated.');
        } else if (freq === 'ONCE') {
          const evId = eventId || (overlay.querySelector('#ns-event') ? overlay.querySelector('#ns-event').value.trim() : '');
          await api.post('createSeva', Object.assign(common, { date: overlay.querySelector('#ns-date').value, eventId: evId }));
          toast('Seva opportunity created.');
        } else {
          const evId = eventId || (overlay.querySelector('#ns-event') ? overlay.querySelector('#ns-event').value.trim() : '');
          const result = await api.post('createRecurringPattern', Object.assign(common, {
            recurrenceType: freq,
            dayOfWeek: overlay.querySelector('#ns-dow').value,
            weekOfMonth: overlay.querySelector('#ns-week').value,
            eventId: evId
          }));
          toast(`Recurring seva created — ${result.created} date${result.created === 1 ? '' : 's'} already scheduled.`);
        }
        bustCache();
        overlay.remove();
        if (onDone) onDone();
      } catch (e) { overlay.querySelector('#ns-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
    });
  }

  // ---- Events (shared: both roles can create events and add seva under them) ----
  async function showEvents() {
    paintTabs('events');
    body.innerHTML = skeletons(2);
    const [allEvents, allSeva] = await Promise.all([
      cachedGet('allEvents:' + pin, () => api.get('allEvents', { pin }), 8000),
      fetchSevaList()
    ]);
    // Today-and-upcoming by default, ascending; "Show History" reveals past
    // events too. An event counts as "upcoming" through its last day --
    // multi-day events use End Date, single-day events (no End Date) fall
    // back to Start Date, same rule the public Events tab uses.
    const today = todayLocalStr();
    const events = allEvents
      .filter(ev => showHistory || String(ev['End Date'] || ev['Start Date'] || '') >= today)
      .sort((a, b) => String(a['Start Date'] || '').localeCompare(String(b['Start Date'] || '')));
    // Seva under each event is filtered the same way, so "Edit" lists (and
    // the reschedule-candidate list elsewhere) don't surface past dates
    // unless history is on.
    const seva = filterAndSortByDate(allSeva, 'Date');
    const sevaByEvent = {};
    seva.forEach(s => {
      const key = s['Event ID'];
      if (!key) return;
      (sevaByEvent[key] = sevaByEvent[key] || []).push(s);
    });

    body.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
        <button class="btn btn-primary" id="new-event-btn">+ New Event</button>
        ${historyToggleHtml()}
      </div>
      ${events.length ? `<div class="card-grid">${events.map(ev => {
        const evSeva = sevaByEvent[ev['Event ID']] || [];
        return `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div class="card-title">${escapeHtml(ev['Event Name'])}</div>
            <span class="badge ${String(ev['Status']).toUpperCase() === 'ACTIVE' ? 'open' : 'full'}">${escapeHtml(ev['Status'])}</span>
          </div>
          <div class="meta">
            <span>📅 ${fmtDate(ev['Start Date'])}${ev['End Date'] && ev['End Date'] !== ev['Start Date'] ? ' – ' + fmtDate(ev['End Date']) : ''}</span>
            ${ev['Location'] ? `<span>📍 ${escapeHtml(ev['Location'])}</span>` : ''}
          </div>
          ${ev['Description'] ? `<div class="desc">${escapeHtml(ev['Description'])}</div>` : ''}
          <p class="helper">Event ID: ${escapeHtml(ev['Event ID'])}</p>
          <div style="margin:10px 0;">
            <div style="font-weight:600; font-size:13px; margin-bottom:6px;">Seva under this event (${evSeva.length}${isSuperAdmin ? '' : ' — your type'})</div>
            ${evSeva.length ? evSeva.map(s => `
              <div class="reg-row">
                <div class="who">${escapeHtml(s['Seva Name'])}<br><span class="m">${fmtDate(s['Date'])} · ${s.RegisteredCount}/${s['Max Volunteers'] || '—'} registered${s['Recurring Pattern ID'] ? ' · recurring' : ''} · ${escapeHtml(s['Status'])}</span></div>
                <button class="btn btn-outline small" data-edit-event-seva="${escapeHtml(s['Seva ID'])}">Edit</button>
              </div>
            `).join('') : '<p class="muted">No seva added yet.</p>'}
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-ghost small" data-add-seva-event="${escapeHtml(ev['Event ID'])}">+ Add Seva</button>
            <button class="btn btn-outline small" data-edit-event="${escapeHtml(ev['Event ID'])}">Edit Event</button>
          </div>
        </div>
      `; }).join('')}</div>` : `<div class="empty">${showHistory ? 'No events on record.' : 'No upcoming events — create one above, or turn on Show History to see past ones.'}</div>`}
    `;

    document.getElementById('new-event-btn').addEventListener('click', () => openEventModal(null, showEvents));
    bindHistoryToggle(showEvents);
    body.querySelectorAll('[data-edit-event]').forEach(btn => {
      btn.addEventListener('click', () => {
        const ev = events.find(e => String(e['Event ID']) === btn.dataset.editEvent);
        openEventModal(ev, showEvents);
      });
    });
    body.querySelectorAll('[data-add-seva-event]').forEach(btn => {
      btn.addEventListener('click', () => openSevaModal({ eventId: btn.dataset.addSevaEvent }, showEvents));
    });
    body.querySelectorAll('[data-edit-event-seva]').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = seva.find(x => String(x['Seva ID']) === btn.dataset.editEventSeva);
        openSevaModal(s || {}, showEvents);
      });
    });
  }

  function openEventModal(existing, onDone) {
    const isEdit = !!existing;
    const overlay = openModal(`
      <div class="sheet-head"><h3>${isEdit ? 'Edit Event' : 'New Event'}</h3><button class="close-x" id="modal-close">✕</button></div>
      <div class="field"><label>Event Name</label><input id="ev-name" value="${isEdit ? escapeHtml(existing['Event Name']) : ''}"></div>
      <div class="field"><label>Description</label><textarea id="ev-desc" rows="2">${isEdit ? escapeHtml(existing['Description']) : ''}</textarea></div>
      <div class="row-2">
        <div class="field"><label>Start Date</label><input id="ev-start" type="date" value="${isEdit ? escapeHtml(fmtInputDate(existing['Start Date'])) : ''}"></div>
        <div class="field"><label>End Date</label><input id="ev-end" type="date" value="${isEdit ? escapeHtml(fmtInputDate(existing['End Date'])) : ''}"></div>
      </div>
      <div class="field"><label>Location</label><input id="ev-location" value="${isEdit ? escapeHtml(existing['Location']) : ''}"></div>
      <div class="field">
        <label>Banner Image URL</label>
        <input id="ev-image" value="${isEdit ? escapeHtml(existing['Image URL'] || '') : ''}" placeholder="Optional — paste a link to an image (e.g. from Google Photos, Drive, or any public image URL)">
        <div id="ev-image-preview" style="margin-top:8px;"></div>
      </div>
      ${isEdit ? `
      <div class="field"><label>Status</label>
        <select id="ev-status">
          <option value="ACTIVE" ${existing['Status'] === 'ACTIVE' ? 'selected' : ''}>Active</option>
          <option value="CANCELLED" ${existing['Status'] === 'CANCELLED' ? 'selected' : ''}>Cancelled</option>
          <option value="COMPLETED" ${existing['Status'] === 'COMPLETED' ? 'selected' : ''}>Completed</option>
        </select>
      </div>` : ''}
      <button class="btn btn-primary" id="ev-submit">${isEdit ? 'Save Changes' : 'Create Event'}</button>
      <div id="ev-msg"></div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
    const imageInput = overlay.querySelector('#ev-image');
    const imagePreview = overlay.querySelector('#ev-image-preview');
    function refreshImagePreview() {
      const url = imageInput.value.trim();
      imagePreview.innerHTML = url ? `<img src="${escapeHtml(url)}" alt="" style="width:100%; max-height:140px; object-fit:cover; border-radius:10px; border:1px solid var(--line);" onerror="this.replaceWith(Object.assign(document.createElement('p'), {className:'error-text', textContent:'Could not load an image from that URL.'}))">` : '';
    }
    imageInput.addEventListener('input', refreshImagePreview);
    refreshImagePreview();
    overlay.querySelector('#ev-submit').addEventListener('click', async () => {
      const payload = {
        pin,
        name: overlay.querySelector('#ev-name').value.trim(),
        description: overlay.querySelector('#ev-desc').value.trim(),
        startDate: overlay.querySelector('#ev-start').value,
        endDate: overlay.querySelector('#ev-end').value,
        location: overlay.querySelector('#ev-location').value.trim(),
        imageUrl: imageInput.value.trim()
      };
      try {
        if (isEdit) {
          payload.eventId = existing['Event ID'];
          payload.status = overlay.querySelector('#ev-status').value;
          await api.post('updateEvent', payload);
          toast('Event updated.');
        } else {
          await api.post('createEvent', payload);
          toast('Event created.');
        }
        bustCache();
        overlay.remove();
        if (onDone) onDone();
      } catch (e) { overlay.querySelector('#ev-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
    });
  }

  // ---- Recurring Seva (weekly or "Nth weekday of month") ----
  // Any admin can see and manage this now: a scoped admin only sees/creates
  // patterns for their own Seva Type (enforced server-side), Super Admin sees all.
  async function showRecurring() {
    paintTabs('recurring');
    body.innerHTML = skeletons(2);
    const [patterns, events] = await Promise.all([
      cachedGet('allRecurringPatterns:' + pin, () => api.get('allRecurringPatterns', { pin }), 8000),
      cachedGet('allEvents:' + pin, () => api.get('allEvents', { pin }), 8000)
    ]);
    const eventName = (id) => { const ev = events.find(e => String(e['Event ID']) === String(id)); return ev ? ev['Event Name'] : null; };
    body.innerHTML = `
      <button class="btn btn-primary" id="new-recur-btn" style="margin-bottom:10px;">+ New Recurring Seva</button>
      <button class="btn btn-ghost" id="generate-recur-btn" style="margin-bottom:14px;">Generate Occurrences Now</button>
      ${patterns.length ? `<div class="card-grid">${patterns.map(p => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
            <div class="card-title">${escapeHtml(p['Seva Name'])}</div>
            <span class="badge ${String(p['Active']).toUpperCase() === 'TRUE' ? 'open' : 'full'}">${String(p['Active']).toUpperCase() === 'TRUE' ? 'ACTIVE' : 'PAUSED'}</span>
          </div>
          <div class="meta">
            <span>${describePattern(p)}</span>
            ${p['Start Time'] ? `<span>⏰ ${fmtTime(p['Start Time'])}${p['End Time'] ? '–' + fmtTime(p['End Time']) : ''}</span>` : ''}
            ${p['Location'] ? `<span>📍 ${escapeHtml(p['Location'])}</span>` : ''}
            ${p['Event ID'] && eventName(p['Event ID']) ? `<span class="badge event">${escapeHtml(eventName(p['Event ID']))}</span>` : ''}
          </div>
          <button class="btn btn-outline small" data-toggle-pattern="${escapeHtml(p['Pattern ID'])}" data-active="${String(p['Active']).toUpperCase()}">
            ${String(p['Active']).toUpperCase() === 'TRUE' ? 'Pause' : 'Resume'}
          </button>
        </div>
      `).join('')}</div>` : '<div class="empty">No recurring seva set up yet.</div>'}
    `;
    document.getElementById('new-recur-btn').addEventListener('click', () => openRecurringModal(events));
    document.getElementById('generate-recur-btn').addEventListener('click', async () => {
      try {
        const result = await api.post('generateRecurringOccurrences', { pin });
        bustCache();
        toast(`${result.created} seva occurrence(s) generated.`);
      } catch (e) { toast(e.message); }
    });
    body.querySelectorAll('[data-toggle-pattern]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          const makeActive = btn.dataset.active !== 'TRUE';
          await api.post('updateRecurringPattern', { pin, patternId: btn.dataset.togglePattern, active: makeActive });
          bustCache();
          showRecurring();
        } catch (e) { toast(e.message); }
      });
    });
  }

  function describePattern(p) {
    const dow = DOW_NAMES[Number(p['Day Of Week'])] || '';
    if (String(p['Recurrence Type']).toUpperCase() === 'MONTHLY_NTH') {
      const nth = p['Week Of Month'];
      const label = String(nth).toUpperCase() === 'LAST' ? 'Last' : { 1: '1st', 2: '2nd', 3: '3rd', 4: '4th' }[nth] || nth;
      return `🗓 ${label} ${dow} of every month`;
    }
    return `🔁 Every ${dow}`;
  }

  // events: the already-fetched event list, so this can offer an optional
  // "attach to an event" dropdown without a separate round trip.
  function openRecurringModal(events) {
    const overlay = openModal(`
      <div class="sheet-head"><h3>New Recurring Seva</h3><button class="close-x" id="modal-close">✕</button></div>
      ${isSuperAdmin ? `<div class="field"><label>Seva Type ID</label><input id="rp-type" placeholder="e.g. ST_ABC123"></div>` : ''}
      <div class="field"><label>Event (optional)</label>
        <select id="rp-event">
          <option value="">Standalone — not tied to an event</option>
          ${(events || []).map(ev => `<option value="${escapeHtml(ev['Event ID'])}">${escapeHtml(ev['Event Name'])}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Seva Name</label><input id="rp-name"></div>
      <div class="field"><label>Repeats</label>
        <select id="rp-recurtype">
          <option value="WEEKLY">Every week</option>
          <option value="MONTHLY_NTH" selected>One specific week each month</option>
        </select>
      </div>
      <div class="row-2">
        <div class="field"><label>Day of Week</label>
          <select id="rp-dow">${DOW_NAMES.map((d, i) => `<option value="${i}" ${i === 0 ? 'selected' : ''}>${d}</option>`).join('')}</select>
        </div>
        <div class="field" id="rp-week-wrap">
          <label>Which week</label>
          <select id="rp-week">
            <option value="1" selected>1st</option><option value="2">2nd</option><option value="3">3rd</option>
            <option value="4">4th</option><option value="LAST">Last</option>
          </select>
        </div>
      </div>
      <div class="row-2">
        <div class="field"><label>Start Time</label><input id="rp-start" type="time"></div>
        <div class="field"><label>End Time</label><input id="rp-end" type="time"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Location</label><input id="rp-location"></div>
        <div class="field"><label>Max Volunteers</label><input id="rp-max" type="number"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Contact Person</label><input id="rp-contact-person" placeholder="Optional"></div>
        <div class="field"><label>Contact Number</label><input id="rp-contact-number" placeholder="Optional"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="rp-instructions" rows="2" placeholder="Optional — anything volunteers or fellow admins should know"></textarea></div>
      <button class="btn btn-primary" id="rp-submit">Create Recurring Seva</button>
      <p class="helper">"One specific week each month" (e.g. 2nd Sunday) suits most monthly seva. Pick "Every week" for something like every Sunday instead.</p>
      <div id="rp-msg"></div>
    `);
    overlay.querySelector('#modal-close').addEventListener('click', () => overlay.remove());
    const recurTypeEl = overlay.querySelector('#rp-recurtype');
    const weekWrap = overlay.querySelector('#rp-week-wrap');
    const syncRecurType = () => { weekWrap.style.display = recurTypeEl.value === 'MONTHLY_NTH' ? 'block' : 'none'; };
    recurTypeEl.addEventListener('change', syncRecurType);
    syncRecurType();
    overlay.querySelector('#rp-submit').addEventListener('click', async () => {
      const payload = {
        pin,
        eventId: overlay.querySelector('#rp-event').value,
        name: overlay.querySelector('#rp-name').value.trim(),
        recurrenceType: recurTypeEl.value,
        dayOfWeek: overlay.querySelector('#rp-dow').value,
        weekOfMonth: overlay.querySelector('#rp-week').value,
        startTime: overlay.querySelector('#rp-start').value,
        endTime: overlay.querySelector('#rp-end').value,
        location: overlay.querySelector('#rp-location').value.trim(),
        maxVolunteers: overlay.querySelector('#rp-max').value,
        contactPerson: overlay.querySelector('#rp-contact-person').value.trim(),
        contactNumber: overlay.querySelector('#rp-contact-number').value.trim(),
        instructions: overlay.querySelector('#rp-instructions').value.trim()
      };
      if (isSuperAdmin) payload.sevaTypeId = overlay.querySelector('#rp-type').value.trim();
      try {
        const result = await api.post('createRecurringPattern', payload);
        bustCache();
        overlay.remove();
        toast(`Recurring seva created — ${result.created} date${result.created === 1 ? '' : 's'} already scheduled.`);
        showRecurring();
      } catch (e) { overlay.querySelector('#rp-msg').innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`; }
    });
  }

  // ---- Participants — Super Admin only ----
  // Lets an admin find a participant directly (rather than going seva by
  // seva) and register them into any currently open seva from a dropdown --
  // the same adminAddParticipant_ backend action used on the Seva tab's Add
  // Participant modal, just entered from the other direction.
  async function showParticipants() {
    paintTabs('participants');
    body.innerHTML = skeletons(3);
    const [participants, sevaList] = await Promise.all([
      cachedGet('allParticipants:' + pin, () => api.get('allParticipants', { pin }), 8000),
      fetchSevaList()
    ]);
    const activeSeva = sevaList
      .filter(s => String(s['Status']).toUpperCase() === 'ACTIVE')
      .sort((a, b) => {
        const d = String(a['Date']).localeCompare(String(b['Date']));
        return d !== 0 ? d : String(a['Start Time']).localeCompare(String(b['Start Time']));
      });
    const sevaOptionsHtml = activeSeva.map(s => {
      const timeText = s['Start Time'] ? ` ${fmtTime(s['Start Time'])}` : '';
      return `<option value="${escapeHtml(s['Seva ID'])}">${escapeHtml(s['Seva Name'])} — ${escapeHtml(fmtDate(s['Date']))}${escapeHtml(timeText)}</option>`;
    }).join('');

    function participantRow(p) {
      return `
        <tr class="row-summary" data-pt-row="${escapeHtml(p['Participant ID'])}">
          <td class="name-cell"><span class="row-chevron">▸</span>${escapeHtml(p['Full Name'])}</td>
          <td>${escapeHtml(p['Mobile Number'])}</td>
          <td>${escapeHtml(p['Status'] || 'ACTIVE')}</td>
        </tr>
        <tr class="row-detail hidden"><td colspan="3">
          ${p['Email'] ? `<div class="muted" style="margin:4px 0;">✉ ${escapeHtml(p['Email'])}</div>` : ''}
          <div class="field" style="margin-top:8px;">
            <label>Assign to Seva</label>
            <select id="pt-select-${escapeHtml(p['Participant ID'])}">
              <option value="">Select an open seva…</option>
              ${sevaOptionsHtml}
            </select>
          </div>
          <button class="btn btn-primary small" style="margin-top:8px;" data-assign-seva="${escapeHtml(p['Participant ID'])}" data-name="${escapeHtml(p['Full Name'])}">Assign</button>
          <div data-assign-msg="${escapeHtml(p['Participant ID'])}"></div>
        </td></tr>
      `;
    }

    function renderList(query) {
      const q = (query || '').trim().toLowerCase();
      const filtered = q
        ? participants.filter(p => String(p['Full Name']).toLowerCase().indexOf(q) !== -1 || String(p['Mobile Number']).indexOf(q) !== -1)
        : participants;
      const listEl = document.getElementById('pt-list');
      listEl.innerHTML = filtered.length
        ? tableShell(['Name', 'Mobile', 'Status'], filtered.map(participantRow).join(''))
        : '<div class="empty">No participants match your search.</div>';
      bindExpandableRows(listEl);
      listEl.querySelectorAll('[data-assign-seva]').forEach(assignBtn => {
        assignBtn.addEventListener('click', async () => {
          const participantId = assignBtn.dataset.assignSeva;
          const select = document.getElementById('pt-select-' + participantId);
          const sevaId = select.value;
          const msgEl = listEl.querySelector(`[data-assign-msg="${participantId}"]`);
          if (!sevaId) { msgEl.innerHTML = `<div class="error-text">Please select a seva first.</div>`; return; }
          try {
            await api.post('adminAddParticipant', { pin, sevaId, participantId });
            bustCache();
            toast(`${assignBtn.dataset.name} assigned. 🙏`);
            msgEl.innerHTML = `<div class="muted">Assigned ✓</div>`;
          } catch (e) {
            msgEl.innerHTML = `<div class="error-text">${escapeHtml(e.message)}</div>`;
          }
        });
      });
    }

    body.innerHTML = `
      <div class="field" style="margin-bottom:14px;"><input type="text" id="pt-search" placeholder="Search participants by name or mobile…"></div>
      <div id="pt-list"></div>
    `;
    body.querySelector('#pt-search').addEventListener('input', e => renderList(e.target.value));
    renderList('');
  }

  // ---- Reports — Super Admin only ----
  async function showReports() {
    paintTabs('reports');
    body.innerHTML = `
      <div class="pill-toggle">
        <button class="btn btn-ghost small" data-report="seva">Seva-wise</button>
        <button class="btn btn-ghost small" data-report="participant">Participant-wise</button>
        <button class="btn btn-ghost small" data-report="event">Event-wise</button>
      </div>
      <div id="report-table"><p class="muted">Choose a report above.</p></div>
    `;
    body.querySelectorAll('[data-report]').forEach(b => {
      b.addEventListener('click', async () => {
        const type = b.dataset.report;
        const table = document.getElementById('report-table');
        table.innerHTML = skeletons(1);
        const data = await api.get('reports', { pin, type });
        if (!data.length) { table.innerHTML = '<p class="muted">No data.</p>'; return; }
        const cols = Object.keys(data[0]);
        table.innerHTML = `<table class="simple"><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr>${data.map(row => `<tr>${cols.map(c => `<td>${escapeHtml(row[c])}</td>`).join('')}</tr>`).join('')}</table>`;
      });
    });
  }

  content.querySelectorAll('[data-sa-view]').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.saView === 'overview') showOverview();
      else if (b.dataset.saView === 'seva') showSeva();
      else if (b.dataset.saView === 'events') showEvents();
      else if (b.dataset.saView === 'recurring') showRecurring();
      else if (b.dataset.saView === 'participants') showParticipants();
      else showReports();
    });
  });

  if (isSuperAdmin) showOverview(); else showSeva();
}

function fmtInputDate(d) {
  if (!d) return '';
  const m = String(d).match(/^(\d{4}-\d{2}-\d{2})/);
  return m ? m[1] : '';
}

/* ---------------- Boot ---------------- */
updateIdentityBar();
setTab('home');
</script>
</body>
</html>
